<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FYI Coaches' Corner v1.09.44</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E8801A'/%3E%3Ctext x='32' y='43' font-family='Arial, Helvetica, sans-serif' font-weight='800' font-size='27' fill='%23ffffff' text-anchor='middle'%3ECC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --radius:10px; }
/* Theme palettes, taken directly from The Bridge, one per tab, so Coaches'
   Corner reads as the same product rather than a lookalike. The body's
   theme class switches with the active tab, same mechanism The Bridge
   uses per business. */
body.theme-clients{ --bg:#F4F6F9;--card:#FFF;--primary:#2A3550;--accent:#4A6FA5;--accent2:#C59C44;--text:#26293A;--muted:#69707F;--border:#DFE3EB; }
body.theme-prospects{ --bg:#F7F5F9;--card:#FFF;--primary:#3B2F4A;--accent:#7A5C93;--accent2:#C59C44;--text:#312A3A;--muted:#6F6678;--border:#E5DFEA; }
body.theme-rel{ --bg:#F4F7F6;--card:#FFF;--primary:#24413C;--accent:#3E8E7E;--accent2:#C59C44;--text:#22322E;--muted:#657771;--border:#DCE7E3; }
body.theme-sop{ --bg:#F7F5F2;--card:#FFF;--primary:#3B3730;--accent:#8A6D3F;--accent2:#6090C9;--text:#332F29;--muted:#726B60;--border:#E6E0D6; }
body.theme-training{ --bg:#F5F3F8;--card:#FFF;--primary:#3A3252;--accent:#6B5B95;--accent2:#C59C44;--text:#2E2940;--muted:#6E6880;--border:#E4DFEC; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg,#F4F6F9);color:var(--text,#26293A);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;transition:background .25s ease}
h1,h2,h3,.brand,nav button,.section-title{font-family:'Montserrat',sans-serif}
.hidden{display:none !important}
/* ---- Login ---- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1D4D71}
.loginBox{background:#fff;border-radius:12px;padding:36px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.loginBox h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;margin:0 0 4px;color:#2A3550}
.loginBox p.sub{color:#69707F;font-size:13px;margin:0 0 20px}
.loginBox input{width:100%;padding:10px 12px;border:1px solid #DFE3EB;border-radius:8px;margin-bottom:10px;font-size:14px;font-family:'Inter',sans-serif}
.loginBox button{width:100%;padding:11px;border:0;border-radius:8px;background:#4A6FA5;color:#fff;font-size:14px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer}
.loginBox button:hover{filter:brightness(.94)}
.loginErr{color:#B23A33;font-size:13px;margin:8px 0 0;min-height:16px}
.loginLinks{margin-top:14px;font-size:12px;color:#69707F;text-align:center}
.loginLinks a{color:#4A6FA5;cursor:pointer;text-decoration:none;font-weight:600}
/* ---- App shell ---- */
#app{display:none}
#app.show{display:block}
header.top{background:#1D4D71;color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
header.top .brand{font-weight:800;font-size:17px}
header.top .verBadge{font-family:'Inter',sans-serif;font-size:.62rem;font-weight:600;color:#D9E7F0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:2px 8px;border-radius:99px;margin-left:8px;cursor:pointer;vertical-align:middle}
header.top .verBadge:hover{background:rgba(255,255,255,.2)}
header.top .brand small{font-weight:500;font-family:'Inter',sans-serif;color:#AFC9DC;margin-left:8px;font-size:12px}
header.top .who{font-size:13px;color:#D9E7F0;display:flex;align-items:center;gap:12px}
header.top .who button{background:transparent;border:1px solid #3E7098;color:#D9E7F0;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif}
nav{display:flex;gap:7px;background:var(--card,#fff);border-bottom:1px solid var(--border,#DFE3EB);padding:12px 22px;overflow-x:auto;flex-wrap:wrap}
nav button{padding:8px 15px;border-radius:999px;border:1.5px solid var(--border,#DFE3EB);background:var(--bg,#F4F6F9);color:var(--muted,#69707F);cursor:pointer;font-size:.8rem;font-weight:600;white-space:nowrap;transition:all .15s ease}
nav button:hover{border-color:var(--accent,#4A6FA5);color:var(--primary,#2A3550)}
nav button.active{background:var(--primary,#2A3550);border-color:var(--primary,#2A3550);color:#fff}
main{padding:22px;max-width:1140px;margin:0 auto}
.banner{background:#FBF3E2;border:1px solid #E0B45C;color:#8A671B;padding:10px 14px;border-radius:9px;font-size:13px;margin-bottom:16px}
.banner.err{background:#FBEBEA;border-color:#D98782;color:#A8382F}
.banner.ok{background:#EFF7EF;border-color:#7BAE7F;color:#3E7C43}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.toolbar input[type=search]{padding:8px 12px;border:1px solid var(--border,#DFE3EB);border-radius:8px;font-size:13px;min-width:220px;font-family:'Inter',sans-serif;background:var(--card,#fff)}
.cl-filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.cl-filter{padding:6px 12px;border-radius:999px;border:1.5px solid var(--border,#DFE3EB);background:var(--bg,#F4F6F9);color:var(--muted,#69707F);font-size:.75rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.cl-filter:hover{border-color:var(--accent,#4A6FA5);color:var(--primary,#2A3550)}
.cl-filter.active{background:var(--primary,#2A3550);border-color:var(--primary,#2A3550);color:#fff}
.btn{padding:7px 13px;border:0;border-radius:7px;background:var(--accent,#4A6FA5);color:#fff;font-size:.78rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.btn:hover{filter:brightness(.94)}
.btn.secondary{background:transparent;color:var(--primary,#2A3550);border:1px solid var(--accent,#4A6FA5)}
.btn.ghost{background:transparent;color:var(--muted,#69707F);border:1px solid var(--border,#DFE3EB)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.card{background:var(--bg,#F4F6F9);border:1px solid var(--border,#DFE3EB);border-radius:var(--radius);padding:13px 14px;border-left:4px solid var(--border,#DFE3EB);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.07)}
.card.rag-green{border-left-color:#57A05C}
.card.rag-amber{border-left-color:#E0A93C}
.card.rag-red{border-left-color:#C0453F}
.card.pr-fresh{border-left-color:#57A05C}
.card.pr-warm{border-left-color:#E0A93C}
.card.pr-stale{border-left-color:#C0453F}
.card h3{margin:0 0 4px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.94rem;color:var(--primary,#2A3550)}
.card .meta{font-size:.71rem;color:var(--muted,#69707F);display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:.63rem;font-weight:600;background:var(--card,#fff);border:1px solid var(--border,#DFE3EB);color:var(--muted,#69707F)}
.tag.green{background:#EFF7EF;border-color:#7BAE7F;color:#3E7C43}
.tag.amber{background:#FBF3E2;border-color:#E0B45C;color:#8A671B}
.tag.red{background:#FBEBEA;border-color:#D98782;color:#A8382F}
.tag.grey{background:var(--card,#fff);color:var(--muted,#69707F)}
.empty{color:var(--muted,#69707F);font-size:13px;padding:30px;text-align:center}
/* ---- Detail panel ---- */
.detail{background:var(--card,#fff);border:1px solid var(--border,#DFE3EB);border-radius:12px;padding:22px}
.detail .back{background:none;border:0;color:var(--accent,#4A6FA5);font-weight:700;cursor:pointer;font-size:.8rem;margin-bottom:14px;padding:0;font-family:'Inter',sans-serif}
.detail h2{margin:0 0 16px;font-family:'Montserrat',sans-serif;font-weight:800;color:var(--primary,#2A3550)}
.fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.63rem;color:var(--muted,#69707F);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--border,#DFE3EB);border-radius:6px;font-size:13px;font-family:'Inter',sans-serif;background:var(--bg,#F4F6F9)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent,#4A6FA5);background:var(--card,#fff)}
.field textarea{grid-column:1/-1;min-height:70px;resize:vertical}
.field.full{grid-column:1/-1}
.detailActions{margin-top:18px;display:flex;gap:8px;align-items:center}
.savedNote{font-size:12px;color:var(--muted,#69707F)}
/* ---- SOPs ---- */
.sopList{display:flex;flex-direction:column;gap:6px}
.sopRow{padding:10px 12px;border:1px solid var(--border,#DFE3EB);border-radius:8px;background:var(--card,#fff);cursor:pointer;display:flex;justify-content:space-between;font-size:13px}
.sopRow:hover{border-color:var(--accent,#8A6D3F)}
.sopGroup{font-size:.66rem;text-transform:uppercase;color:var(--muted,#69707F);letter-spacing:.05em;margin:16px 0 6px;font-weight:700}
.sopDoc{background:var(--card,#fff);border:1px solid var(--border,#DFE3EB);border-radius:12px;padding:22px;line-height:1.55;font-size:14px}
.sopDoc h2{margin-top:0;font-family:'Montserrat',sans-serif;color:var(--primary,#3B3730)}
.sopDoc h4{margin:18px 0 6px;font-size:.66rem;text-transform:uppercase;color:var(--muted,#726B60);letter-spacing:.04em}
/* ---- Training ---- */
.module{background:var(--card,#fff);border:1px solid var(--border,#E4DFEC);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.module h3{margin:0 0 6px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.9rem;color:var(--primary,#3A3252)}
.module .why{color:var(--muted,#6E6880);font-size:13px;margin-bottom:10px}
.module ul.checklist{list-style:none;padding:0;margin:0}
.module ul.checklist li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px}
.module ul.checklist input{margin-top:3px;accent-color:var(--accent,#6B5B95)}
.resList{border-top:1px solid var(--border,#E4DFEC)}
.resRow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--border,#E4DFEC)}
.resRow:last-child{border-bottom:0}
.resT{font-size:13.5px;font-weight:600;color:var(--text,#2E2940)}
.resD{font-size:12.5px;color:var(--muted,#6E6880);margin-top:2px}
.resGo{font-size:12.5px;font-weight:600;color:var(--accent,#6B5B95);text-decoration:none;white-space:nowrap}
.resGo:hover{text-decoration:underline}
.resSoon{font-size:11.5px;color:var(--muted,#6E6880);background:var(--bg,#F5F3F8);border-radius:10px;padding:3px 9px;white-space:nowrap}
.progressBar{height:6px;background:var(--border,#E4DFEC);border-radius:3px;overflow:hidden;margin:10px 0 20px}
.progressBar .fill{height:100%;background:var(--accent,#6B5B95)}

/* ---- DISC profile block, ported exactly from The Bridge's own CSS and
   colours, not the Sales Animal PDF's red styling. ---- */
.dp-body{display:grid;grid-template-columns:minmax(300px,1.1fr) minmax(260px,1fr);gap:26px;align-items:start}
@media(max-width:760px){.dp-body{grid-template-columns:1fr;gap:18px}}
.dp-chart{position:relative;height:290px;padding-left:74px}
.dp-grid{position:absolute;left:0;right:0;top:0;height:238px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.dp-gl{display:flex;align-items:center;gap:9px}
.dp-gl span{width:64px;text-align:right;font-size:.62rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted,#69707F);font-weight:700;flex-shrink:0}
.dp-gl i{flex:1;height:1px;background:var(--border,#DFE3EB);display:block}
.dp-bars{position:relative;display:flex;gap:16px;height:290px;align-items:flex-end}
.dp-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.dp-barwrap{width:100%;height:238px;display:flex;align-items:flex-end}
.dp-bar{width:100%;border-radius:6px 6px 0 0;min-height:6px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dp-bar.v4{background:#C0453F} .dp-bar.v3{background:#E0A93C}
.dp-bar.v2{background:#6090C9} .dp-bar.v1{background:#9AA0B0}
.dp-lab{font-family:'Montserrat',sans-serif;font-weight:800;font-size:1.5rem;color:var(--primary,#2A3550);margin-top:9px;line-height:1}
.dp-val{font-size:.66rem;color:var(--muted,#69707F);font-weight:600;text-align:center;line-height:1.25;margin-top:3px}
.dp-side{display:flex;flex-direction:column;gap:14px}
.dp-hero{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.dp-hn{font-family:'Montserrat',sans-serif;font-weight:800;font-size:1.7rem;color:var(--primary,#2A3550);line-height:1.05}
.dp-hid{font-size:.7rem;font-weight:700;letter-spacing:.05em;color:var(--muted,#69707F);border:1px solid var(--border,#DFE3EB);border-radius:99px;padding:3px 10px}
.dp-reads{display:flex;gap:10px}
.dp-reads>div{flex:1;background:var(--bg,#F4F6F9);border:1px solid var(--border,#DFE3EB);border-radius:9px;padding:10px 12px;font-size:.72rem;color:var(--muted,#69707F);line-height:1.45}
.dp-reads span{display:block;font-size:.58rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted,#69707F);font-weight:700}
.dp-reads b{display:block;font-family:'Montserrat',sans-serif;font-size:1.35rem;color:var(--accent,#4A6FA5);line-height:1.1;margin:2px 0 3px}
.dp-meta{display:flex;flex-direction:column;gap:7px;padding-top:13px;border-top:1px solid var(--border,#DFE3EB)}
.dp-meta>div{display:flex;gap:10px;font-size:.81rem;color:var(--text,#26293A)}
.dp-meta span{font-size:.6rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted,#69707F);font-weight:700;min-width:118px;padding-top:2px;flex-shrink:0}
.dp-coach{background:var(--bg,#F4F6F9);border:1px solid var(--border,#DFE3EB);border-left:3px solid var(--accent2,#C59C44);border-radius:9px;padding:12px 14px}
.dp-coach b{display:block;font-family:'Montserrat',sans-serif;font-size:.78rem;color:var(--primary,#2A3550);margin-bottom:4px}
.dp-coach p{margin:0;font-size:.8rem;color:var(--text,#26293A);line-height:1.5}

/* ---- Compact two-panel client detail, matched to The Bridge's own
   skinny layout, replacing the padded fieldGrid version. ---- */
.cd2-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.cd2-cols{grid-template-columns:1fr}}
.cd2-panel{background:var(--bg,#F4F6F9);border:1px solid var(--border,#DFE3EB);border-radius:10px;padding:16px 18px}
.cd2-panel h4{margin:0 0 12px;font-family:'Montserrat',sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted,#69707F);font-weight:800}
.cd2-row{margin-bottom:10px}
.cd2-row label{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted,#69707F);font-weight:700;margin-bottom:3px}
.cd2-row input,.cd2-row select,.cd2-row textarea{width:100%;padding:6px 9px;border:1px solid var(--border,#DFE3EB);border-radius:6px;font-size:13px;font-family:'Inter',sans-serif;background:var(--card,#fff)}
.cd2-row textarea{min-height:60px;resize:vertical}
.cd2-inline{display:flex;gap:8px;align-items:center}
.cd2-inline input[type=text],.cd2-inline input[type=email],.cd2-inline input[type=tel]{flex:1}
.cd2-inline label{display:flex;align-items:center;gap:4px;font-size:.62rem;text-transform:none;font-weight:600;white-space:nowrap;margin:0}
.cd2-static{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-top:1px solid var(--border,#DFE3EB)}
.cd2-static span{color:var(--muted,#69707F)}
.cd2-static b{color:var(--text,#26293A)}
.cd2-log-hist{display:flex;flex-direction:column-reverse;gap:6px;margin-top:10px}
.cd2-log-item{font-size:12.5px;padding:6px 0;border-top:1px solid var(--border,#DFE3EB)}
.cd2-log-item .meta{display:flex;justify-content:space-between;color:var(--muted,#69707F);font-weight:600}
.cd2-log-item .note{margin-top:3px;color:var(--text,#26293A)}

/* ---- Relationships tab, styled to match Ben's standalone tracker exactly ---- */
.relTracker{--rt-navy:#333547;--rt-blue:#6090c7;--rt-blue-dark:#4a76ab;--rt-gold:#c59c44;--rt-silver:#d8d8d8;--rt-red:#b3452c;--rt-paper:#f7f7f5;--rt-ink-soft:#6b6d7a;font-family:'Montserrat',sans-serif;color:var(--rt-navy)}
.relTracker .rt-dash{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.relTracker .rt-dash-card{background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 1px 2px rgba(51,53,71,.06),0 6px 20px rgba(51,53,71,.06);border-left:4px solid var(--rt-silver)}
.relTracker .rt-dash-card .num{font-size:28px;font-weight:800;line-height:1}
.relTracker .rt-dash-card .lbl{font-size:12px;color:var(--rt-ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
.relTracker .rt-dash-card.overdue{border-left-color:var(--rt-red)} .relTracker .rt-dash-card.overdue .num{color:var(--rt-red)}
.relTracker .rt-dash-card.soon{border-left-color:var(--rt-gold)} .relTracker .rt-dash-card.soon .num{color:var(--rt-gold)}
.relTracker .rt-dash-card.ok{border-left-color:var(--rt-blue)} .relTracker .rt-dash-card.ok .num{color:var(--rt-blue-dark)}
.relTracker .rt-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.relTracker .rt-toolbar input[type=text]{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--rt-silver);border-radius:8px;font-family:inherit;font-size:13px;background:#fff}
.relTracker .rt-toolbar select{padding:10px 12px;border:1px solid var(--rt-silver);border-radius:8px;font-family:inherit;font-size:13px;background:#fff;color:var(--rt-navy)}
.relTracker .rt-btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:8px;padding:10px 16px;border:none;cursor:pointer}
.relTracker .rt-btn-primary{background:var(--rt-navy);color:#fff}
.relTracker .rt-btn-ghost{background:#fff;color:var(--rt-navy);border:1px solid var(--rt-silver)}
.relTracker .rt-chips{display:flex;gap:6px}
.relTracker .rt-chip{padding:8px 12px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid var(--rt-silver);background:#fff;cursor:pointer;color:var(--rt-ink-soft)}
.relTracker .rt-chip.active{background:var(--rt-navy);color:#fff;border-color:var(--rt-navy)}
.relTracker .rt-row{background:#fff;border-radius:10px;box-shadow:0 1px 2px rgba(51,53,71,.06),0 6px 20px rgba(51,53,71,.06);padding:14px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.relTracker .rt-ring-wrap{flex:none;position:relative;width:52px;height:52px}
.relTracker .rt-ring-wrap svg{width:52px;height:52px;transform:rotate(-90deg)}
.relTracker .rt-ring-bg{fill:none;stroke:#eceef2;stroke-width:5}
.relTracker .rt-ring-fg{fill:none;stroke-width:5;stroke-linecap:round}
.relTracker .rt-ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.relTracker .rt-main{flex:1;min-width:220px}
.relTracker .rt-name-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.relTracker .rt-name{font-weight:700;font-size:15px;cursor:pointer}
.relTracker .rt-name:hover{text-decoration:underline}
.relTracker .rt-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:12px;background:#eef1f7;color:var(--rt-blue-dark)}
.relTracker .rt-heat{font-size:11.5px;font-weight:800;color:#fff;border-radius:12px;padding:3px 10px}
.relTracker .rt-company{font-size:12.5px;color:var(--rt-ink-soft);margin-top:1px}
.relTracker .rt-meta{font-size:12.5px;color:var(--rt-ink-soft);margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
.relTracker .rt-meta a{color:var(--rt-ink-soft);text-decoration:none}
.relTracker .rt-last{font-size:12px;color:var(--rt-ink-soft);margin-top:4px}
.relTracker .rt-last b{color:var(--rt-navy)}

<script>
/* ================= Identity (no widget) ================= */
const IDENTITY = location.origin + '/.netlify/identity';
function saveSession(s){ localStorage.setItem('cc_session', JSON.stringify(s)); }
function getSession(){ try{ return JSON.parse(localStorage.getItem('cc_session')||'null'); }catch(e){ return null; } }
function clearSession(){ localStorage.removeItem('cc_session'); }

async function doLogin(){
  const email=document.getElementById('liEmail').value.trim();
  const pass=document.getElementById('liPass').value;
  const err=document.getElementById('liErr'); err.textContent='';
  if(!email||!pass){ err.textContent='Enter your email and password.'; return; }
  try{
    const r=await fetch(IDENTITY+'/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'grant_type=password&username='+encodeURIComponent(email)+'&password='+encodeURIComponent(pass)});
    const d=await r.json();
    if(!r.ok){ err.textContent = d.error_description || 'Sign in failed. Check your email and password.'; return; }
    saveSession({access_token:d.access_token, refresh_token:d.refresh_token, email});
    boot();
  }catch(e){ err.textContent='Could not reach the sign-in service.'; }
}

function showAccept(){ document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('acceptScreen').classList.remove('hidden'); }
function showLogin(){ document.getElementById('acceptScreen').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden'); }

async function doAccept(){
  const token=document.getElementById('acToken').value.trim();
  const pass=document.getElementById('acPass').value;
  const err=document.getElementById('acErr'); err.textContent='';
  if(!token||!pass){ err.textContent='Paste the token and choose a password.'; return; }
  try{
    /* Password must be included in this single call. A separate verify-then-update
       pattern fails, and a failed token attempt burns the token, requiring a fresh
       invite. */
    const r=await fetch(IDENTITY+'/verify',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:'signup', token, password:pass})});
    const d=await r.json();
    if(!r.ok){ err.textContent = d.msg || d.error_description || 'That token was not accepted. Ask Ben to resend the invite.'; return; }
    saveSession({access_token:d.token && d.token.access_token, refresh_token:d.token && d.token.refresh_token, email:d.email});
    boot();
  }catch(e){ err.textContent='Could not reach the sign-in service.'; }
}

function doLogout(){ clearSession(); location.reload(); }

async function authedFetch(url, opts){
  const s=getSession();
  opts=opts||{}; opts.headers=Object.assign({'Authorization':'Bearer '+(s?s.access_token:''), 'Content-Type':'application/json'}, opts.headers||{});
  let r=await fetch(url,opts);
  if(r.status===401 && s && s.refresh_token){
    const rr=await fetch(IDENTITY+'/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(s.refresh_token)});
    if(rr.ok){ const d=await rr.json(); saveSession({access_token:d.access_token, refresh_token:d.refresh_token, email:s.email});
      opts.headers['Authorization']='Bearer '+d.access_token; r=await fetch(url,opts); }
  }
  return r;
}

/* ================= Versioning ================= */
/* major.month.build, month zero-padded, matching The Bridge's convention.
   Bump APP_VERSION, the <title>, the header badge, and add a RELEASES
   entry, all in the same edit, or the changelog silently falls behind
   the build the way The Bridge's own once did. */
/* Sent once all 12 supervised submissions are marked complete. Content is
   Ben's own, transcribed verbatim from The Bridge, name swap only. Copies
   as rich text via ClipboardItem so pasting into a Gmail compose keeps
   the bold and underlined headers, not plain text like the other copy
   buttons in this app. */
function supervisionMilestoneEmail(name){
  const first=(name||'').trim().split(' ')[0]||'there';
  const subject='Congratulations, you have reached the milestone of 12 supervised submissions.';
  const html=
    'Hi '+first+',<br><br>'+
    'We\u2019ve now completed the review of over 12 supervised submissions, both at the pre-bank stage and '+
    'the pre-submission stage, as required under the Connective supervision program. Well done getting through all 12.<br><br>'+
    '<u>What we\u2019re seeing in the audits</u><br>'+
    'Six things come up repeatedly across file reviews. These aren\u2019t one-off notes; they\u2019re the pattern, '+
    'so treat them as your checklist on every submission from here:<br><br>'+
    '(a) Employment details. Full employment history, plus a named contact to verify it, completed in full, every time.<br>'+
    '(b) Living expenses. Must sit 7% above the minimum lender HEM figure, not equal to it.<br>'+
    '(c) Assets. Should be commensurate with the applicant\u2019s age. Check what someone in that age bracket would '+
    'reasonably have accumulated, and query anything that looks light.<br>'+
    '(d) Notes. More than 20 entries showing your conversations with the applicant, your observations on assets, '+
    'liabilities and living expenses, plus any compliance issues or anything unique to the file. If it\u2019s not '+
    'written down, it didn\u2019t happen.<br>'+
    '(e) Attachments. Every document carrying a TFN needs redaction. Equifax and all mandatory documents ordered correctly.<br>'+
    '(f) Calculations. Surplus in the funding position must be sufficient, and living expenses in the financials must '+
    'match the borrowing capacity figure. If you\u2019ve used Quickli, replicate it in the Connective calculator. If '+
    'the two don\u2019t match, leave a compliance note explaining why.<br><br>'+
    '<u>Two standing reminders</u><br>'+
    '(a) Use the BID snippet builder on every file. It\u2019s your proof you\u2019ve covered every area of the best '+
    'interests duty, not just a formality.<br>'+
    '(b) If a complaint is ever made, Connective as licence holder takes over that complaint. What isn\u2019t in the '+
    'file in writing never existed. Your notes are your protection as much as the client\u2019s.<br><br>'+
    'Going forward<br>'+
    'You\u2019re clear of the 12 mandated reviews for this stage, but the standard doesn\u2019t drop off. '+
    'Keep running every file against these six points before it goes anywhere near submission.<br><br>'+
    'Any file you want a second set of eyes on before you send it, flick it to me first.';
  const text=html.replace(/<u>|<\/u>/g,'').replace(/<br><br>/g,'\n\n').replace(/<br>/g,'\n');
  return {subject:subject, html:html, text:text};
}

function copySupervisionEmail(clientId){
  const c=STATE.clients.find(x=>x.airtableId===clientId);
  const btn=document.getElementById('supEmailBtn');
  const label=btn.textContent;
  const em=supervisionMilestoneEmail(c.n);
  const done2=()=>{ btn.textContent='\u2713 Copied, paste into Gmail'; setTimeout(()=>btn.textContent=label,2200); };
  const fallback=()=>{ navigator.clipboard.writeText(em.subject+'\n\n'+em.text).then(done2)
    .catch(()=>alert('Copy failed. Select the text manually.')); };
  if(window.ClipboardItem){
    try{
      const item=new ClipboardItem({
        'text/html': new Blob([em.html], {type:'text/html'}),
        'text/plain': new Blob([em.text], {type:'text/plain'})
      });
      navigator.clipboard.write([item]).then(done2).catch(fallback);
    } catch(e){ fallback(); }
  } else { fallback(); }
}

/* ================= State ================= */
const STATE = { coach:null, principal:false, clients:[], prospects:[], relationships:[], tab:'clients',
  clientOpen:null, prospectOpen:null, relOpen:null, sopOpen:null, trainProgress:{}, sessions:{}, lastSessions:{} };

async function boot(){
  const s=getSession();
  if(!s){ return; }
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('acceptScreen').classList.add('hidden');
  document.getElementById('app').classList.add('show');
  document.getElementById('whoEmail').textContent = s.email || '';
  await loadRoster();
  await loadTraining();
  loadFireflies().then(()=>{ if(STATE.tab==='clients') render(); }); /* not awaited: never block first paint on a third-party API */
  loadCalendar().then(()=>{ if(STATE.tab==='clients') render(); });
  setTab('dashboard');
}

function banner(msg, kind){
  const m=document.getElementById('main');
  const b=document.createElement('div');
  b.className='banner'+(kind?(' '+kind):'');
  b.textContent=msg;
  m.prepend(b);
  if(kind!=='err') setTimeout(()=>b.remove(), 5000);
}

async function loadRoster(){
  try{
    const r=await authedFetch('/.netlify/functions/sync-roster',{method:'POST'});
    const d=await r.json();
    if(!r.ok || !d.ok){ document.getElementById('main').innerHTML='<div class="banner err">'+(d.message||d.why||'Could not load your roster. Reload, or tell Ben if it keeps happening.')+'</div>'; return; }
    STATE.coach=d.coach; STATE.principal=d.principal; STATE.admin=d.admin;
    STATE.clients=d.clients||[]; STATE.prospects=d.prospects||[]; STATE.relationships=d.relationships||[];
    document.getElementById('coachBadge').textContent = STATE.admin ? 'admin, all coaches' : STATE.principal ? 'all coaches' : STATE.coach;
  }catch(e){ document.getElementById('main').innerHTML='<div class="banner err">Could not reach the server. Check your connection and reload.</div>'; }
}

async function loadFireflies(){
  try{
    const r=await authedFetch('/.netlify/functions/fireflies',{method:'POST'});
    const d=await r.json();
    STATE.fireflies = (d.ok && d.byClient) ? d.byClient : {};
  }catch(e){ STATE.fireflies = {}; }
}

async function loadCalendar(){
  try{
    const r=await authedFetch('/.netlify/functions/calendar',{method:'POST'});
    const d=await r.json();
    STATE.sessions = (d.ok && d.sessions) ? d.sessions : {};
    STATE.lastSessions = (d.ok && d.lastSessions) ? d.lastSessions : {};
  }catch(e){ STATE.sessions = {}; STATE.lastSessions = {}; }
}

async function loadTraining(){
  try{
    const r=await authedFetch('/.netlify/functions/state',{method:'GET'});
    const d=await r.json();
    STATE.trainProgress = d.value ? JSON.parse(d.value) : {};
  }catch(e){ STATE.trainProgress = {}; }
}
async function saveTraining(){
  try{ await authedFetch('/.netlify/functions/state',{method:'POST', body: JSON.stringify({value: JSON.stringify(STATE.trainProgress)})}); }
  catch(e){ banner('Progress could not be saved. Try again.', 'err'); }
}

function setTab(t){
  STATE.tab=t; STATE.clientOpen=null; STATE.prospectOpen=null; STATE.relOpen=null; STATE.sopOpen=null;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  /* Same mechanism The Bridge uses per business: the active tab decides
     the palette, so Coaches' Corner shifts tone the same way rather than
     staying one flat colour throughout. */
  const THEME_CLASS = { dashboard:'theme-clients', clients:'theme-clients', prospects:'theme-prospects', relationships:'theme-rel', sops:'theme-sop', training:'theme-training' };
  document.body.className = THEME_CLASS[t] || 'theme-clients';
  render();
}
function render(){
  const fn = { dashboard:renderDashboard, clients:renderClients, prospects:renderProspects, relationships:renderRelationships,
    sops:renderSOPs, training:renderTraining }[STATE.tab];
  document.getElementById('main').innerHTML='';
  fn();
}

/* ================= Dashboard ================= */
function svgColumnChart(data, opts){
  opts=opts||{};
  const W=opts.w||600, H=opts.h||220, padTop=20, padBottom=44, padLeft=34, padRight=14;
  const chartW=W-padLeft-padRight, chartH=H-padTop-padBottom;
  const max=Math.max(1, ...data.map(d=>d.value));
  const barW=Math.min(56, chartW/data.length-14);
  const gap=(chartW-barW*data.length)/(data.length+1);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  [0,.25,.5,.75,1].forEach(f=>{
    const y=padTop+chartH*(1-f);
    svg+='<line x1="'+padLeft+'" y1="'+y+'" x2="'+(W-padRight)+'" y2="'+y+'" stroke="#e5e5e5" stroke-width="1"/>';
    svg+='<text x="'+(padLeft-6)+'" y="'+(y+3)+'" text-anchor="end" font-family="Inter,sans-serif" font-size="9" fill="#999">'+Math.round(max*f)+'</text>';
  });
  data.forEach((d,i)=>{
    const bh=(d.value/max)*chartH;
    const x=padLeft+gap+i*(barW+gap);
    const y=padTop+chartH-bh;
    svg+='<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+Math.max(bh,1)+'" fill="'+(d.color||'#4A6FA5')+'" rx="3"/>';
    svg+='<text x="'+(x+barW/2)+'" y="'+(padTop+chartH-bh-6)+'" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="12" fill="#2A3550">'+d.value+'</text>';
    const label=d.label.length>12 ? d.label.slice(0,11)+'\u2026' : d.label;
    svg+='<text x="'+(x+barW/2)+'" y="'+(H-24)+'" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#6b7480" transform="rotate(0 '+(x+barW/2)+' '+(H-24)+')"><title>'+d.label+'</title>'+label+'</text>';
  });
  svg+='</svg>';
  return svg;
}
function dashStatCard(num, label, color, onclick){
  return '<div class="card" style="cursor:'+(onclick?'pointer':'default')+';border-left:4px solid '+(color||'#DFE3EB')+'"'+(onclick?' onclick="'+onclick+'"':'')+'>'+
    '<div style="font-family:Montserrat,sans-serif;font-weight:800;font-size:1.7rem;color:var(--primary,#2A3550)">'+num+'</div>'+
    '<div style="font-size:.72rem;color:var(--muted,#69707F);margin-top:2px">'+label+'</div></div>';
}
/* Last real contact = the latest of the Zoom date Airtable calculates and
   anything logged in the client's Contact log. Before 1.09.38 the dashboard
   and cards read only the Airtable Zoom formula, so a logged call or
   message never counted. The free-text Notes box has no date, so it cannot. */
function lastTouch(c){
  const dates=[];
  if(c.lastZoomDate) dates.push(String(c.lastZoomDate).slice(0,10));
  clientContactLogFor(c).forEach(e=>{ if(e && e.date) dates.push(String(e.date).slice(0,10)); });
  if(!dates.length) return {date:null, days:null};
  const date=dates.sort().slice(-1)[0];
  const days=Math.max(0,Math.floor((Date.now()-new Date(date+'T00:00:00').getTime())/86400000));
  return {date, days};
}
function renderDashboard(){
  const m=document.getElementById('main');
  const active = STATE.clients.filter(c=>c.clientStatus==='Active' && !c.shared);
  const nearingGrad = active.filter(c=>c.daysToGrad!=null && c.daysToGrad<=60 && c.daysToGrad>=0);
  active.forEach(c=>{ c._lt=lastTouch(c); });
  const notContacted = active.filter(c=>c._lt.days!=null && c._lt.days>30);
  const neverZoom = active.filter(c=>!c._lt.date);
  const upcomingBdays = active.map(c=>({c, days:bdayNext(c.dob)})).filter(x=>x.days!=null && x.days<=14).sort((a,b)=>a.days-b.days);
  const activeProspects = STATE.prospects.filter(p=>!p.archived);
  const staleProspects = activeProspects.filter(p=>p.idle>45);
  const activeRels = STATE.relationships.filter(r=>!r.archived);
  const overdueRels = activeRels.filter(r=>relCadenceStatus(r).cls==='overdue');

  const stageOrder=['1. Immersion','2. Development','3. Momentum','4. Mature','10. Optimisation'];
  const stageCounts={};
  active.forEach(c=>{ const s=c.st||'Unset'; stageCounts[s]=(stageCounts[s]||0)+1; });
  const stageData=Object.keys(stageCounts).sort((a,b)=>{
    const ia=stageOrder.indexOf(a), ib=stageOrder.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  }).map(s=>({label:s.replace(/^\d+\.\s*/,''), value:stageCounts[s]}));

  const engCounts={Green:0,Amber:0,Red:0,Unset:0};
  active.forEach(c=>{ const e=c.rag||'Unset'; engCounts[e]=(engCounts[e]||0)+1; });
  const engData=[
    {label:'Green', value:engCounts.Green, color:'#57A05C'},
    {label:'Amber', value:engCounts.Amber, color:'#E0A93C'},
    {label:'Red', value:engCounts.Red, color:'#C0453F'},
    {label:'Unset', value:engCounts.Unset, color:'#9AA0B0'}
  ].filter(d=>d.value>0);

  const progCounts={};
  active.forEach(c=>{ const p=c.p||'Unset'; progCounts[p]=(progCounts[p]||0)+1; });
  const progData=Object.entries(progCounts).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));

  let html = '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:20px">'+
    dashStatCard(active.length, 'Active clients', '#4A6FA5', "STATE.clientFilter='active'; setTab('clients')")+
    dashStatCard(nearingGrad.length, 'Nearing graduation, 60d', '#C59C44')+
    dashStatCard(upcomingBdays.length, 'Birthdays, next 14d', '#8C3B63')+
    dashStatCard(notContacted.length, 'Not contacted 30d+', '#C0453F')+
    dashStatCard(activeProspects.length, 'Active prospects', '#7A5C93', "setTab('prospects')")+
    dashStatCard(staleProspects.length, 'Prospects gone quiet', '#C0453F')+
    dashStatCard(overdueRels.length, 'Relationships overdue', '#3E8E7E')+
  '</div>';

  html += '<div class="cd2-cols" style="margin-top:0">'+
    '<div class="cd2-panel"><h4>Nearing graduation</h4>'+
      (nearingGrad.length ? nearingGrad.sort((a,b)=>a.daysToGrad-b.daysToGrad).map(c=>
        '<div class="cd2-static" style="cursor:pointer" onclick="STATE.clientOpen=\''+c.airtableId+'\'; setTab(\'clients\')"><span>'+c.n+'</span><b>'+c.daysToGrad+'d</b></div>'
      ).join('') : '<div class="empty" style="padding:14px">None within 60 days.</div>')+
    '</div>'+
    '<div class="cd2-panel"><h4>Not contacted in 30+ days</h4>'+
      (notContacted.length ? notContacted.sort((a,b)=>b._lt.days-a._lt.days).map(c=>
        '<div class="cd2-static" style="cursor:pointer" onclick="STATE.clientOpen=\''+c.airtableId+'\'; setTab(\'clients\')"><span>'+c.n+'</span><b>'+c._lt.days+'d</b></div>'
      ).join('') : '<div class="empty" style="padding:14px">Everyone\u2019s been contacted recently.</div>')+
      (neverZoom.length ? '<div style="font-size:.68rem;color:var(--muted,#69707F);margin-top:8px">'+neverZoom.length+' client'+(neverZoom.length===1?'':'s')+' with no contact on record at all.</div>' : '')+
    '</div>'+
  '</div>';

  html += '<div class="cd2-panel" style="margin-top:14px"><h4>Birthdays in the next 14 days</h4>'+
    (upcomingBdays.length ? upcomingBdays.map(x=>
      '<div class="cd2-static" style="cursor:pointer" onclick="STATE.clientOpen=\''+x.c.airtableId+'\'; setTab(\'clients\')"><span>'+x.c.n+'</span><b>'+(x.days===0?'today':x.days===1?'tomorrow':'in '+x.days+'d')+'</b></div>'
    ).join('') : '<div class="empty" style="padding:14px">None in the next two weeks.</div>')+
  '</div>';

  html += '<div class="cd2-cols" style="margin-top:14px">'+
    '<div class="cd2-panel"><h4>Clients by lifecycle stage</h4>'+svgColumnChart(stageData)+'</div>'+
    '<div class="cd2-panel"><h4>Clients by engagement</h4>'+svgColumnChart(engData)+'</div>'+
  '</div>'+
  '<div class="cd2-panel" style="margin-top:14px"><h4>Clients by program</h4>'+svgColumnChart(progData, {h:200})+'</div>';

  m.innerHTML=html;
}

function ragTag(v){
  const k=(v||'').toLowerCase();
  if(k==='green') return '<span class="tag green">Green</span>';
  if(k==='amber') return '<span class="tag amber">Amber</span>';
  if(k==='red') return '<span class="tag red">Red</span>';
  return v ? '<span class="tag grey">'+v+'</span>' : '';
}
function ragClass(v){
  const k=(v||'').toLowerCase();
  return (k==='green'||k==='amber'||k==='red') ? ' rag-'+k : '';
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(dateStr+'T00:00:00');
  return Math.round((d-t)/86400000);
}
function bdayNext(dob){
  if(!dob) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  const p=dob.split('-'); if(p.length<3) return null;
  let b=new Date(t.getFullYear(), Number(p[1])-1, Number(p[2]));
  if(b<t) b.setFullYear(b.getFullYear()+1);
  return Math.round((b-t)/86400000);
}
/* Graduation is now read directly from Airtable's own Days To Graduation
   formula, not recalculated here, so the two numbers can never drift
   apart. This client-side version is retired. */
function discMiniBars(animal){
  const lv=discLevels(animal); if(!lv) return '';
  return '<span style="display:inline-flex;align-items:flex-end;gap:2px;height:14px;margin-right:5px">'+
    lv.map(b=>'<span style="display:inline-block;width:4px;height:'+(b.v/4*14)+'px;background:currentColor;border-radius:1px"></span>').join('')+
  '</span>';
}

/* Immersion is the first 12 weeks from the start date, confirmed directly
   rather than assumed, since nothing in The Bridge's own source defines
   it. Shown as a countdown, negative while days remain, crossing to
   positive if the client runs past the 12 weeks without moving stage. */
function immersionCountdown(c){
  if(!c.startDate || !/1\.\s*immersion/i.test(c.st||'')) return null;
  const start=new Date(c.startDate+'T00:00:00');
  const t=new Date(); t.setHours(0,0,0,0);
  const daysSince=Math.round((t-start)/86400000);
  return daysSince-84;
}

/* How the client list is ordered, ported from The Bridge's six sort
   modes. "Quietest first" and "Next session" both lean on real data
   already synced in this app, calendar sessions and Fireflies, not a
   separate concept invented for sorting alone. */
const CLIENT_SORTS = [
  {k:'newest',  n:'Newest first',     d:'Most recent start date'},
  {k:'oldest',  n:'Longest standing', d:'Earliest start date'},
  {k:'quiet',   n:'Quietest first',   d:'Longest since contact'},
  {k:'session', n:'Next session',     d:'Soonest booked, unbooked at the top'},
  {k:'fee',     n:'Highest fee',      d:'Monthly fee, largest first'},
  {k:'name',    n:'Name',             d:'Alphabetical'}
];
function lastContactFor(c){
  const first=c.n.split(' ')[0];
  const calLast=(STATE.lastSessions||{})[first];
  const ffEntries=(STATE.fireflies||{})[c.n];
  const ffLast = ffEntries && ffEntries.length ? ffEntries[0].date : null;
  const dates=[calLast, ffLast].filter(Boolean);
  return dates.length ? dates.sort().slice(-1)[0] : null;
}
function sortClients(list){
  const byName=(a,b)=>String(a.n||'').localeCompare(String(b.n||''));
  const started=c=>c.startDate||'';
  switch(STATE.clientSort){
    case 'oldest':
      return list.sort((a,b)=>{
        const x=started(a), y=started(b);
        if(!x&&!y) return byName(a,b);
        if(!x) return 1; if(!y) return -1;
        return x.localeCompare(y) || byName(a,b);
      });
    case 'quiet':
      return list.sort((a,b)=>{
        const x=lastContactFor(a), y=lastContactFor(b);
        if(!x&&!y) return byName(a,b);
        if(!x) return -1; if(!y) return 1; /* never contacted is the quietest of all */
        return x.localeCompare(y) || byName(a,b);
      });
    case 'session':
      return list.sort((a,b)=>{
        const x=(STATE.sessions||{})[a.n.split(' ')[0]], y=(STATE.sessions||{})[b.n.split(' ')[0]];
        if(!x&&!y) return byName(a,b);
        if(!x) return -1; if(!y) return 1;
        return String(x).localeCompare(String(y)) || byName(a,b);
      });
    case 'fee':
      return list.sort((a,b)=>(Number(b.f)||0)-(Number(a.f)||0)||byName(a,b));
    case 'name':
      return list.sort(byName);
    case 'newest':
    default:
      return list.sort((a,b)=>{
        const x=started(a), y=started(b);
        if(!x&&!y) return byName(a,b);
        if(!x) return 1; if(!y) return -1;
        return y.localeCompare(x) || byName(a,b);
      });
  }
}

function renderClients(){
  const m=document.getElementById('main');
  if(STATE.clientOpen) return renderClientDetail();
  if(!STATE.clientFilter) STATE.clientFilter='active';
  if(!STATE.clientSort) STATE.clientSort='newest';
  const q=(document.getElementById('cQ')?document.getElementById('cQ').value:'').toLowerCase();

  const bar=document.createElement('div'); bar.className='toolbar';
  bar.innerHTML='<input type="search" id="cQ" placeholder="Search clients" oninput="render()" value="'+(q?q:'')+'">'+
    '<div style="display:flex;gap:8px;align-items:center">'+
      '<select id="cSort" title="'+(CLIENT_SORTS.find(s=>s.k===STATE.clientSort)||{}).d+'" onchange="STATE.clientSort=this.value; render()">'+
        CLIENT_SORTS.map(s=>'<option value="'+s.k+'" '+(STATE.clientSort===s.k?'selected':'')+'>Sort: '+s.n+'</option>').join('')+
      '</select>'+
      '<button class="btn" onclick="openNewClient()">New client</button>'+
    '</div>';
  m.appendChild(bar);

  /* Filter chips. Coach chips only appear for Ben, since a coach's own
     view is already scoped to just their name, a filter for it would be
     a no-op. Options that would need Argo or Too Easy Socials data, or
     the Airtable fields still pending migration (contacts confirmed,
     First 30 Days running), are left out rather than shown and left
     broken. */
  const chipRow=document.createElement('div'); chipRow.className='cl-filters';
  CLIENT_FILTERS.forEach(f=>{
    const b=document.createElement('button'); b.className='cl-filter'+(STATE.clientFilter===f.id?' active':'');
    b.textContent=f.label; b.onclick=()=>{ STATE.clientFilter=f.id; render(); };
    chipRow.appendChild(b);
  });
  if(STATE.principal){
    /* Chips: current coaches always show, so a new coach has a chip before
       their first client lands. Anyone else shows only while they still
       have an Active client, and a retired coach never shows. Their past
       clients stay reachable under Previous clients and Everyone. */
    const withActive=new Set(STATE.clients.filter(c=>c.clientStatus==='Active').map(c=>c.c).filter(Boolean));
    const coaches=[...new Set([...CURRENT_COACHES,...withActive])].filter(n=>!RETIRED_COACHES.includes(n)).sort();
    coaches.forEach(name=>{
      const id='coach:'+name;
      const b=document.createElement('button'); b.className='cl-filter'+(STATE.clientFilter===id?' active':'');
      b.textContent=name+"'s"; b.onclick=()=>{ STATE.clientFilter=id; render(); };
      chipRow.appendChild(b);
    });
    SHARE_COACHES.forEach(name=>{
      const id='shared:'+name;
      const b=document.createElement('button'); b.className='cl-filter'+(STATE.clientFilter===id?' active':'');
      b.textContent='Shared with '+name; b.onclick=()=>{ STATE.clientFilter=id; render(); };
      chipRow.appendChild(b);
    });
  }
  m.appendChild(chipRow);

  const activeFilter = CLIENT_FILTERS.find(f=>f.id===STATE.clientFilter);
  const coachFilterName = (!activeFilter && STATE.clientFilter && STATE.clientFilter.indexOf('coach:')===0) ? STATE.clientFilter.slice(6) : null;
  /* Every filter except Everyone and Previous clients implicitly means
     "still in the programme": someone who's left shouldn't reappear just
     because a coach chip or a future filter doesn't happen to check
     Status itself. Status is the one real signal for this, so nothing
     new was added, this just makes every filter respect it consistently. */
  const sharedFilterName = (!activeFilter && STATE.clientFilter && STATE.clientFilter.indexOf('shared:')===0) ? STATE.clientFilter.slice(7) : null;
  const stillInProgramme = c => c.clientStatus==='Active';
  const bypassStatusCheck = STATE.clientFilter==='everyone' || STATE.clientFilter==='previous' || STATE.clientFilter==='exitmissing';
  let list = STATE.clients.filter(c=>{
    if(!bypassStatusCheck && !stillInProgramme(c)) return false;
    if(activeFilter) return activeFilter.test(c);
    if(coachFilterName) return c.c===coachFilterName;
    if(sharedFilterName) return (c.sharedWith||[]).includes(sharedFilterName);
    return true;
  });
  list = list.filter(c=>!q || c.n.toLowerCase().includes(q));
  list = sortClients(list);

  const noStartCount = list.filter(c=>!c.startDate).length;
  const countLine=document.createElement('div'); countLine.style.cssText='font-size:.78rem;color:var(--muted,#69707F);margin:2px 0 12px';
  countLine.textContent=list.length+' client'+(list.length===1?'':'s')+(noStartCount?' \u00b7 '+noStartCount+' without a start date':'');
  m.appendChild(countLine);

  if(!list.length){ const e=document.createElement('div'); e.className='empty'; e.textContent='No clients found.'; m.appendChild(e); return; }
  const grid=document.createElement('div'); grid.className='grid';
  list.forEach(c=>{
    const card=document.createElement('div'); card.className='card'+ragClass(c.rag);
    card.onclick=()=>{ STATE.clientOpen=c.airtableId; render(); };

    const contactsCount = [c.mobileInContacts, c.emailInContacts, c.addressInContacts].filter(Boolean).length;
    const bn = bdayNext(c.dob);
    const immCd = immersionCountdown(c);
    const nextSession = (STATE.sessions||{})[c.n.split(' ')[0]];

    let html = '<h3>'+c.n+'</h3>';
    if(c.shared) html += '<div class="meta" style="margin-top:2px"><span class="tag grey">Shared by Ben, view only</span></div>';
    else if(STATE.principal && (c.sharedWith||[]).length) html += '<div class="meta" style="margin-top:2px"><span class="tag" style="background:#E8F1FB;border-color:#BCD3EE;color:#2F5C93">Shared with '+c.sharedWith.join(', ')+'</span></div>';
    if(nextSession){
      const dIn = daysUntil(nextSession);
      html += '<div style="font-size:.76rem;font-weight:700;color:#8A671B;margin-top:2px">Next session '+new Date(nextSession).toLocaleDateString('en-AU')+' &middot; '+(dIn===0?'today':dIn===1?'in 1 day':'in '+dIn+' days')+'</div>';
    }
    html += '<div class="meta" style="margin-top:2px">'+[c.c, c.s, c.st?c.st+(immCd!==null?' ('+(immCd<0?'-':'+')+Math.abs(immCd)+'d)':''):null].filter(Boolean).join(' &middot; ')+'</div>';
    html += '<div class="meta" style="margin-top:8px">';
    if(c.p) html += '<span class="tag" style="background:#E9F0F8;border-color:#C3D6EA;color:#33587F">'+c.p+'</span>';
    if(c.d) html += '<span class="tag" style="background:#F4EFE3;border-color:#DCCFAF;color:#7A6224">'+discMiniBars(c.d)+c.d+'</span>';
    html += '<span class="tag" style="background:'+(contactsCount<3?'#FBEBEA;border-color:#D98782;color:#A8382F':'#EFF7EF;border-color:#7BAE7F;color:#3E7C43')+'">Contacts '+contactsCount+'/3</span>';
    /* Risk Flag reads like "Exit risk: Amber", the colour word is already
       in the string, so it's read off the text itself, not guessed
       against an assumed set of values. */
    if(c.riskFlag){
      const rf=c.riskFlag.toLowerCase();
      const rc = rf.indexOf('red')>-1?'#FBEBEA;border-color:#D98782;color:#A8382F' : rf.indexOf('amber')>-1?'#FBF3E2;border-color:#E0B45C;color:#8A671B' : rf.indexOf('green')>-1?'#EFF7EF;border-color:#7BAE7F;color:#3E7C43' : '#EEF0F2;border-color:#D8D8D8;color:#69707F';
      html += '<span class="tag" style="background:'+rc+'">'+c.riskFlag+'</span>';
    }
    html += '</div>';
    if(c.p30running){
      const p30done = p30StateFor(c).tasks.filter(Boolean).length;
      if(p30done<36) html += '<div class="meta" style="margin-top:6px"><span class="tag" style="background:#F4EFE3;border-color:#DCCFAF;color:#7A6224">30 Days '+p30done+'/36</span></div>';
    }
    if(bn!==null && bn<=30) html += '<div class="meta" style="margin-top:6px"><span class="tag" style="background:#F7E9F0;border-color:#E2C0D2;color:#8C3B63">Birthday in '+bn+'d</span></div>';
    html += '<div style="margin-top:10px;font-size:.78rem;display:flex;flex-direction:column;gap:3px">';
    const lt=lastTouch(c);
    if(lt.date){
      html += '<div style="display:flex;justify-content:space-between"><span style="color:var(--muted,#69707F)">Last contact</span><b>'+new Date(lt.date).toLocaleDateString('en-AU')+' ('+lt.days+'d ago)</b></div>';
    }
    if(c.startDate) html += '<div style="display:flex;justify-content:space-between"><span style="color:var(--muted,#69707F)">Started</span><b>'+new Date(c.startDate).toLocaleDateString('en-AU')+'</b></div>';
    if(c.actualFee!=null){
      html += '<div style="display:flex;justify-content:space-between"><span style="color:var(--muted,#69707F)">Monthly fee</span><b>AUD $'+Number(c.actualFee).toLocaleString()+'</b></div>';
      if(c.addonActive && c.addonEndDate){
        const addonDays=daysUntil(c.addonEndDate);
        html += '<div style="display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted,#69707F)"><span>incl. Mercury Pro</span><span>ends '+new Date(c.addonEndDate).toLocaleDateString('en-AU')+(addonDays!=null?' ('+addonDays+'d)':'')+'</span></div>';
      }
    } else if(c.f) {
      html += '<div style="display:flex;justify-content:space-between"><span style="color:var(--muted,#69707F)">Monthly fee</span><b>AUD $'+Number(c.f).toLocaleString()+'</b></div>';
    }
    if(c.daysToGrad!=null) html += '<div style="display:flex;justify-content:space-between"><span style="color:var(--muted,#69707F)">To graduation</span><b>'+c.daysToGrad+'d</b></div>';
    html += '</div>';
    html += '<div class="cl-open" style="font-size:.68rem;color:var(--accent,#4A6FA5);font-weight:700;margin-top:8px">Open client file &rarr;</div>';
    card.innerHTML = html;
    grid.appendChild(card);
  });
  m.appendChild(grid);
}

function fieldRow(label, id, value, type){
  type=type||'text';
  if(type==='textarea') return '<div class="field full"><label>'+label+'</label><textarea id="'+id+'">'+(value||'')+'</textarea></div>';
  return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+(value==null?'':String(value).replace(/"/g,'&quot;'))+'"></div>';
}

function clientContactLogFor(c){
  try{ const v=JSON.parse(c.contactLog||'[]'); if(Array.isArray(v)) return v; }catch(e){}
  return [];
}

      '<span class="savedNote" id="shareNote"></span>';

  }

async function toggleShare(id, name, on){
  const c=STATE.clients.find(x=>x.airtableId===id);
  const next=new Set(c.sharedWith||[]); if(on) next.add(name); else next.delete(name);
  const arr=[...next];
  const note=document.getElementById('shareNote'); if(note) note.textContent='Saving...';
  try{
    const r=await authedFetch('/.netlify/functions/client-update',{method:'POST', body:JSON.stringify({recordId:id, name:c.n, fields:{sharedWith:arr}})});
    const d=await r.json();
    if(!r.ok || d.ok===false){ if(note) note.textContent=d.message||'Save failed.'; return; }
    c.sharedWith=arr;
    if(note) note.textContent=(on?'Shared with ':'Withdrawn from ')+name+'.';
  }catch(e){ if(note) note.textContent='Could not reach the server.'; }
}

/* ================= First 30 Days, tracked ================= */
/* 36 tasks total, mentee and mentor combined across all five stages,
   counted directly from The Bridge's own PROGRAM_30 script, not
   estimated. Flat list built once so the storage index and the
   rendered order always agree. */
function p30TaskList(){
  const out=[];
  PROGRAM_30.stages.forEach(st=>{
    (st.mentee||[]).forEach(t=>out.push({stageId:st.id, stage:st.n, title:st.t, who:'Mentee', text:t}));
    (st.mentor||[]).forEach(t=>out.push({stageId:st.id, stage:st.n, title:st.t, who:'Mentor', text:t}));
  });
  return out;
}
/* The onboarding meeting (stage 00) also carries a full live-call script,
   numbered items with their own sub-prompts, some plain checkboxes, a
   couple that capture a short answer (the partnership manager's name).
   Separate from the 36-task counter, which only ever counts mentee and
   mentor follow-ups, same as The Bridge's own top-line "X of 36". */
function scriptItemsFor(stage){
  const out=[]; let checkIdx=0;
  (stage.script||[]).forEach(item=>{
    item.p.forEach(p=>{
      if(typeof p==='string'){ out.push({itemN:item.n, itemT:item.t, kind:'check', text:p, checkIdx:checkIdx}); checkIdx++; }
      else { out.push({itemN:item.n, itemT:item.t, kind:'field', text:p.t, field:p.field, placeholder:p.placeholder||''}); }
    });
  });
  return out;
}
function p30StateFor(c){
  try{
    const v=JSON.parse(c.p30||'{}');
    if(Array.isArray(v) && v.length===36) return {tasks:v, script:{}}; /* heals the pre-script format */
    if(v && Array.isArray(v.tasks) && v.tasks.length===36) return {tasks:v.tasks, script:v.script||{}};
  }catch(e){}
  return {tasks:new Array(36).fill(false), script:{}};
}
function p30ScriptStateFor(state, stageId){
  return state.script[stageId] || {checks:[], fields:{}};
}


function comStateFor(c){
  try{ const v=JSON.parse(c.comProg||'{}'); if(v && typeof v==='object' && v.done) return v; }catch(e){}
  return {done:{}};
}
function comEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function comBlocksHtml(bs){
  return bs.map(b=>{
    if(b[0]==='p') return '<p style="font-size:13px;margin:8px 0;line-height:1.55">'+comEsc(b[1])+'</p>';
    if(b[0]==='h') return '<div class="sopGroup" style="margin-top:16px">'+comEsc(b[1])+'</div>';
    if(b[0]==='k') return '<div style="margin:14px 0 4px;padding:6px 12px;border-left:3px solid var(--accent2,#C59C44);background:var(--bg,#F4F6F9);font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--muted,#69707F)">'+comEsc(b[1])+'</div>';
    if(b[0]==='ul') return '<ul style="margin:6px 0 6px;padding-left:18px;font-size:13px;line-height:1.5">'+b[1].map(x=>'<li style="margin-bottom:4px">'+comEsc(x)+'</li>').join('')+'</ul>';
    if(b[0]==='t') return '<div style="overflow-x:auto;margin:10px 0"><table style="border-collapse:collapse;width:100%;font-size:12.5px">'+b[1].map((r,i)=>'<tr>'+r.map((cell,j)=>(i===0?'<th':'<td')+' style="border:1px solid var(--border,#DFE3EB);padding:7px 9px;text-align:left;vertical-align:top;'+(i===0?'background:var(--bg,#F4F6F9);font-family:Montserrat,sans-serif;font-size:.72rem;':(j===0?'font-weight:600;':''))+'">'+comEsc(cell)+(i===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</table></div>';
    return '';
  }).join('');
}

/* ================= Supervision ================= */
/* Twelve applications, each with a borrower name, the date, and a
   Complete tick. Simplified from The Bridge's two-stage review at Ben's
   request, but the name and date are real fields, not decoration.
   Stored as a JSON array of 12 objects in Supervision Progress. */
function supStateFor(c){
  try{
    const v=JSON.parse(c.sup||'[]');
    if(Array.isArray(v) && v.length===12){
      /* Heals the earlier tick-only format automatically, no data lost,
         just upgraded the first time this client's panel is opened. */
      return v.map(x => (x && typeof x === 'object') ? x : {name:'', date:'', complete:!!x});
    }
  }catch(e){}
  return Array.from({length:12}, () => ({name:'', date:'', complete:false}));
}

/* ================= Prospects ================= */
function prTemp(p){ return p.idle>45?'stale' : p.idle>21?'warm' : 'fresh'; }
function prOverdue(p){ return p.close && p.close < new Date().toISOString().slice(0,10); }

function renderProspects(){
  const m=document.getElementById('main');
  if(STATE.prospectOpen) return renderProspectDetail();
  if(!STATE.showArchivedProspects) STATE.showArchivedProspects=false;

  const activeCount=STATE.prospects.filter(p=>!p.archived).length;
  const archivedCount=STATE.prospects.filter(p=>p.archived).length;

  const bar=document.createElement('div'); bar.className='toolbar';
  bar.innerHTML='<div class="cl-filters" style="margin:0">'+
      '<button class="cl-filter'+(!STATE.showArchivedProspects?' active':'')+'" onclick="STATE.showArchivedProspects=false; render()">Active ('+activeCount+')</button>'+
      '<button class="cl-filter'+(STATE.showArchivedProspects?' active':'')+'" onclick="STATE.showArchivedProspects=true; render()">Archived ('+archivedCount+')</button>'+
    '</div>'+
    '<button class="btn" onclick="openNewProspect()">New prospect</button>';
  m.appendChild(bar);

  let list = STATE.prospects.filter(p=> STATE.showArchivedProspects ? p.archived : !p.archived);
  list = list.slice().sort((a,b)=>(b.idle||0)-(a.idle||0));

  if(!list.length){ const e=document.createElement('div'); e.className='empty'; e.textContent=(STATE.showArchivedProspects?'No archived prospects.':'No active prospects found.'); m.appendChild(e); return; }

  const grid=document.createElement('div'); grid.className='grid';
  list.forEach(p=>{
    const temp = prTemp(p);
    const idleCls = p.idle>45?'warn':p.idle>21?'watch':'';
    const card=document.createElement('div'); card.className='card pr-'+temp;
    if(p.archived) card.style.cssText='opacity:.55;filter:grayscale(.6)';
    card.onclick=()=>{ STATE.prospectOpen=p.airtableId; render(); };
    let html='<h3>'+p.n+'</h3>'+
      '<div class="meta" style="margin-top:2px">'+(STATE.principal && p.coach ? p.coach+' &middot; ' : '')+'via '+(p.src||'unknown')+(p.prog?' &middot; '+p.prog:'')+'</div>'+
      '<div class="meta" style="margin-top:8px"><span class="tag grey">'+(p.stage||'No stage')+'</span></div>'+
      '<div style="display:flex;gap:14px;margin:10px 0">'+
        '<div style="flex:1"><div style="font-size:.6rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted,#69707F);font-weight:700">In pipeline</div>'+
          '<div style="font-family:Montserrat,sans-serif;font-weight:700;font-size:1rem;color:var(--primary,#3B2F4A)">'+(p.days||0)+'d</div></div>'+
        '<div style="flex:1"><div style="font-size:.6rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted,#69707F);font-weight:700">Since contact</div>'+
          '<div style="font-family:Montserrat,sans-serif;font-weight:700;font-size:1rem;color:'+(idleCls==='warn'?'#B23A33':idleCls==='watch'?'#8A671B':'var(--primary,#3B2F4A)')+'">'+(p.idle||0)+'d</div></div>'+
        '<div style="flex:1"><div style="font-size:.6rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted,#69707F);font-weight:700">Monthly</div>'+
          '<div style="font-family:Montserrat,sans-serif;font-weight:700;font-size:1rem;color:var(--primary,#3B2F4A)">$'+(p.fee||0).toLocaleString()+'</div></div>'+
      '</div>';
    if(prOverdue(p)) html+='<div style="font-size:.7rem;font-weight:700;color:#B23A33;margin-top:2px">Expected close was '+new Date(p.close).toLocaleDateString('en-AU')+'. Date has passed.</div>';
    if(p.note) html+='<div style="font-size:.76rem;color:var(--muted,#69707F);margin-top:8px;line-height:1.4">'+p.note+'</div>';
    html+='<div class="cl-open" style="font-size:.68rem;color:var(--accent,#7A5C93);font-weight:700;margin-top:8px">Open prospect file &rarr;</div>';
    card.innerHTML=html;
    grid.appendChild(card);
  });
  m.appendChild(grid);
}

/* Cadence status, ported from the standalone tracker Ben built: overdue
   past the cadence window, soon within 3 days of it, ok otherwise.
   Baseline is the last contact date, or the record's creation if never
   contacted, same logic, using Airtable's createdTime isn't available
   here so an uncontacted relationship just reads as overdue from day one
   of this app knowing about it. */
const DEFAULT_CADENCE_DAYS = 11;
function relCadenceStatus(r){
  const cadence = r.cadence>0 ? r.cadence : DEFAULT_CADENCE_DAYS;
  if(!r.last) return {cls:'overdue', daysRemaining:-999, elapsed:cadence, cadence:cadence};
  const elapsed = -daysUntil(r.last);
  const remaining = cadence - elapsed;
  const cls = remaining<0 ? 'overdue' : remaining<=3 ? 'soon' : 'ok';
  return {cls, daysRemaining:remaining, elapsed, cadence};
}
function heatColor(n){
  if(n==null) return '#69707F';
  if(n<5) return '#6090c7';
  if(n<=7) return '#e0873c';
  return '#b3452c';
}
function annualCountdown(dateStr){
  if(!dateStr) return null;
  const p=dateStr.split('-'); if(p.length<3) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  let next=new Date(t.getFullYear(), Number(p[1])-1, Number(p[2]));
  if(next<t) next.setFullYear(t.getFullYear()+1);
  return Math.round((next-t)/86400000);
}
function relRingSVG(status){
  const r=21, circ=2*Math.PI*r;
  const progress=Math.max(0, Math.min(1, status.elapsed/status.cadence));
  const offset=circ*(1-progress);
  const color = status.cls==='overdue'?'#b3452c':status.cls==='soon'?'#c59c44':'#6090c7';
  const label = status.daysRemaining<0 ? Math.abs(status.daysRemaining)+'d' : status.daysRemaining+'d';
  return '<div class="rt-ring-wrap"><svg viewBox="0 0 52 52">'+
      '<circle class="rt-ring-bg" cx="26" cy="26" r="'+r+'"/>'+
      '<circle class="rt-ring-fg" cx="26" cy="26" r="'+r+'" stroke="'+color+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'"/>'+
    '</svg><div class="rt-ring-label" style="color:'+color+'">'+label+'</div></div>';
}

async function quickLog(relId, method, direction){
  const r=STATE.relationships.find(x=>x.airtableId===relId);
  const date=new Date().toISOString().slice(0,10);
  const log=relLogFor(r);
  log.push({date, method, direction});
  r.log=JSON.stringify(log);
  r.last=date;
  try{
    await authedFetch('/.netlify/functions/relationship-update',{method:'POST', body:JSON.stringify({recordId:relId, name:r.n, fields:{log:r.log, last:date}})});
  }catch(e){}
  render();
}

function relLogFor(r){
  try{ const v=JSON.parse(r.log||'[]'); if(Array.isArray(v)) return v; }catch(e){}
  return [];
}

async function addLogEntry(relId){
  const r=STATE.relationships.find(x=>x.airtableId===relId);
  const date=document.getElementById('logDate').value;
  const method=document.getElementById('logMethod').value;
  const direction=document.getElementById('logDirection').value;
  if(!date) return;
  const log=relLogFor(r);
  log.push({date, method, direction});
  r.log=JSON.stringify(log);
  r.last=date; /* logging contact is, by definition, the most recent contact */
  const note=document.getElementById('relSaveNote');
  try{
    const resp=await authedFetch('/.netlify/functions/relationship-update',{method:'POST', body:JSON.stringify({recordId:relId, name:r.n, fields:{log:r.log, last:date}})});
    const dd=await resp.json();
    if(!resp.ok || dd.ok===false){ if(note) note.textContent=dd.message||'Save failed.'; return; }
  }catch(e){ if(note) note.textContent='Could not reach the server.'; return; }
  render();
}

async function pushRelationship(id){
  const isNew = id===null;
  const name = isNew ? document.getElementById('rName').value.trim() : STATE.relationships.find(x=>x.airtableId===id).n;
  if(isNew && !name){ document.getElementById('relSaveNote').textContent='A name is required.'; return; }
  const fields={
    company: document.getElementById('rCompany').value,
    profession: document.getElementById('rProfession').value,
    category: document.getElementById('rCategory').value,
    type: document.getElementById('rType').value,
    pri: document.getElementById('rPri').value,
    status: document.getElementById('rStatus').value,
    email: document.getElementById('rEmail').value,
    phone: document.getElementById('rPhone').value,
    last: document.getElementById('rLast').value,
    cadence: document.getElementById('rCadence').value,
    heat: document.getElementById('rHeat').value,
    birthday: document.getElementById('rBirthday').value,
    keyDateLabel: document.getElementById('rKeyDateLabel').value,
    keyDateValue: document.getElementById('rKeyDateValue').value,
    nextAction: document.getElementById('rNextAction').value,
    notes: document.getElementById('rNotes').value
  };
  const note=document.getElementById('relSaveNote'); note.textContent='Saving...';
  try{
    const r=await authedFetch('/.netlify/functions/relationship-update',{method:'POST', body:JSON.stringify({recordId:id, name, fields})});
    const d=await r.json();
    if(!r.ok || d.ok===false){ note.textContent=d.message||'Save failed.'; return; }
    note.textContent='Saved '+new Date().toLocaleTimeString();
    await loadRoster();
    STATE.relOpen = d.id;
    render();
  }catch(e){ note.textContent='Could not reach the server.'; }
}

const DISC_LETTERS=['D','I','S','C'];
const DISC_LEVELS={4:'Very high',3:'High',2:'Low',1:'Very low'};
function discLevels(animal){
  const a=ANIMALS[animal]; if(!a) return null;
  const [hi,lo]=a.p.split('/');
  const rest=DISC_LETTERS.filter(l=>l!==hi&&l!==lo);
  const out={};
  out[hi]=4; out[lo]=1;
  out[rest[0]] = (a.n===2||a.n===4) ? 3 : 2;
  out[rest[1]] = (a.n===3||a.n===4) ? 3 : 2;
  return DISC_LETTERS.map(l=>({l:l,v:out[l]}));
}

const PROGRAM_COM={"title":"Commercial Know How","sub":"By Belinda Gibson. Twenty-two modules in two parts, run at the pace Belinda sets with each mentee.","mods":[{"id":"W0","part":"Onboarding","t":"The Onboarding Meeting","note":"Mirrors the residential onboarding meeting. Content to come from Belinda.","b":[]},{"id":"A01","part":"A","t":"Your first client","note":"","b":[["h","How do you start the conversation:"],["h","1. The differences between:"],["h","Buying Commercial Property V’s Residential"],["p","Introduce the differences around buying residential properties."],["t",[["Dimension","Residential lending","Commercial lending"],["Property type","Standardised (houses, apartments, townhouses)","Diverse (warehouses, offices, retail, industrial, specialised)"],["Lending values","High leverage common (80% to 95% with LMI)","Conservative (50% to 80%; industry and asset specific)"],["Application fee","Frequently waived or nominal ($0 to $600)","Variable risk/upfront commercial engagement fees"],["Valuations & fee","Standardised, low cost ($0 to $300), rapid delivery","Complex, specialised commercial quotes ($1,500 to $5,000+)"],["Security","Primarily first registered mortgage over real property","Real property + General Security Agreements (GSA) over business assets"],["Guarantees","Rarely required unless supporting a guarantor loan","Personal guarantees from all directors and shareholders are standard"],["Rental income","Standardised market rental estimates via valuation","Complex analysis of weighted average lease expiry (WALE) and outgoings"],["Leases","Simple, short-term residential tenancies (6 to 12 months)","Highly technical commercial leases (3x3, 5x5) containing net/gross lease structures & payment of outgoings. Rent review and CPI increases."],["Capacity to repay","Household income vs. standard living expense matrix (HEF/HEM)","EBITDA, Debt Service Coverage Ratios (DSCR), and Interest Cover Ratios (ICR)"],["Time frames","2 to 14 business days for unconditional approval","Weeks or months depending on complexity, tenders, and valuations"]]],["h","2. Structure:"],["h","Discussion around the Borrowing Entity"],["p","Have the clients meet with their accountant for advice around who is purchasing the property?"],["ul",["Owner Occupied V Investment: Owner Occupied assets are purchased via a Director Entity or SMSF where the operating entity leases from the buying entity to mitigate structural risks. Investment property configurations are handled via SPVs or Corporate Trusts based strictly on yield profiles."]],["p","3. Explain your process."],["p","Its really important to prepare a client engagement letter."],["ul",["Fee for Service: Establish transparency around upfront structural complexity and transaction engagement frameworks.","Tender – Lender Engagement; do they have appetite for this type of transaction? Once a lender sees your scope of works – ideally they’ll provide indicative terms and pricing.","Pricing – Present this back to your clients with pertinent information. Special Offers, Turnaround times, documentation required."]],["h","4. Property Purchase Price:"],["h","Verify these critical tax and transaction metrics on the property:"],["ul",["Does this include GST","Is there a lease attached to the Contract","Is the Vendor registered for GST","Who is the Clients Property Lawyer to assist with the Conveyancing?"]]]},{"id":"A02","part":"A","t":"Pre-appointment questionnaire","note":"","b":[["p","It’s likely your initial enquiry will come via a phone call. Whilst you don’t want to interview a client on the spot; its important to take down some initial facts before setting that first appointment - then you can prepare an agenda for the actual meeting. By asking some basic questions now you can research the client before the meeting."],["p","Here's a guide to help you with the Initial phone call – important questions to ask to gather background information. It’s very similar to what you would ask a residential client. Consider asking: INITIAL “PRE-APPOINTMENT QUESTIONAIRE” FRAMEWORK"],["h","Personal Information:"],["p","1. General Name: ___________________________________________________________________"],["p","2. Address: ________________________________________________________________________"],["p","3. Contact Number: _________________________________________________________________"],["p","4. Email Address: __________________________________________________________________"],["h","Business Information:"],["p","5. Business Name: __________________________________________________________________"],["p","6. Business Address: _______________________________________________________________"],["p","7. Business Type: _______________________ Industry/Trade: __________________________"],["p","8. Australian Business Number (ABN): _______________ GST Registered: [ Y / N ]"],["p","9. Business Website (if applicable):________________________________________________"],["h","Finance Requirements:"],["p","10. Type of Finance Required:_______________________________________________________"],["p","11. Purpose of Finance: ____________________________________________________________"],["h","12. Requested Loan Amount: $_____________________"],["h","13. Desired Loan Term: ______________"],["p","14. Primary Bank:___________________________________________________________________"],["h","Financial Information:"],["p","15. Annual Revenue (Previous Year): $_____________ NBPT (Previous Year): $__________"],["h","16. Monthly Expenses: $__________________________"],["h","17. Current Debt Obligations/Leasing: ___"],["p","18. Financials and Income Tax Returns - last completed date: ________________________"],["h","Additional Details:"],["p","19. How long has your business been established? ___________________________________"],["h","20. Are you an existing Home or Property owner? [ Y / N ]"],["p","21. Do you have any existing assets that can be used as collateral? ________________"],["p","_____________________________________________________________________________________"],["p","Once the above information is known you can prep further before your meeting, knowing what information you will need, prepare relevant questions for your meeting and learn more about the clients and their business."],["h","Collecting Background Information may include:"],["ul",["Reviewing their website","Researching their industry","Googling the Directors/Owners","Can you suggest anything else?"]],["p","This will help to build rapport, uncover needs and learn about the business. We’ll next help you with the meeting questions; Refer to our Fact Sheet – Building Rapport and Relationships with your business clients."]]},{"id":"A03","part":"A","t":"The first interview guide","note":"","b":[["p","Today we are talking about the First Interview and a Guide to a successful meeting. So Brokers if you think about the Client journey so far, for that first client you have:"],["ul",["Completed your PRE-APPOINTMENT QUESTIONNAIRE","Completed some BACKGROUND RESEARCH – so you’ll already have prepared and learnt a bit about your client and their business.","Made an appointment to meet with your client to discuss their needs."]],["p","This session is now about preparing the agenda for the meeting and 9 key topics and a handful of questions you can ask that may be relevant to your client."],["k","PRO-TIP FOR PREPARATION"],["p","My tip here is to prepare an agenda – print it; so your questions are ready to scroll through to ensure you’ve covered everything before you leave."],["p","Let’s jump into the guide to help you structure your first interview with some key questions you should consider asking:"],["h","Business Overview"],["ul",["Please provide an overview of your business, including your industry, products/services, and target market.","How long have you been in operation, and what is your company's legal structure?","How may staff do you employ?","Who are their top 5 clients"]],["h","Financing Purpose"],["ul",["What specific financing objectives do you have?","Are you looking to expand your business, purchase equipment, increase stock/inventory, or handle cash flow gaps?","What is the desired loan amount, the total costs and when are the funds required by?","Potential risks?","Source of repayment"]],["h","Current Financial Situation"],["ul",["Can you provide your financial statements & tax returns for the last two financial years?","Can you provide your last 4 BAS Statements?","Do you have any outstanding loans or debts? If yes, please provide details.","Are your BAS Statements lodged and paid on time?","How are business conditions?"]],["h","Security"],["ul",["What Security will be used for the loan?","Can you provide details about your State of Position/(including property, cash, equipment, stock & inventory?","Are you comfortable in providing a Personal Guarantee to the lender?"]],["h","Business Projections"],["ul",["What are your expected growth plans for the next few years?","Do you have a business plan or sales forecast/budget outlining your projections?","What is your biggest opportunity for growth or what are the areas of priority for your business?"]],["h","Credit History"],["ul",["Have you or your business ever faced any bankruptcies, defaults, or legal issues related to credit?","Do you have clear personal credit?"]],["h","Financing Preferences"],["ul",["Are you looking for short-term or long-term financing?","What repayment terms are you comfortable with? P&I or IO","Are you interested in any specific types of business loans or funding options?","What existing loans and terms do you have?"]],["h","Regulatory and Compliance"],["ul",["Are there any specific legal or regulatory requirements your business needs to meet when obtaining financing?","Is your business affected by changes to commodity prices or currency (farming"]],["p","beef/wool/dairy/wheat – fuel diesel transport – FX for businesses manufacturing/importing or exporting)"],["h","Other Considerations"],["ul",["Is there any additional information or documents you believe are relevant to your financing needs?","Do you have any questions or concerns regarding the application process or the lender's terms?","Can you share any personal goals you have for the business?","What insurances do you have in place?"]],["k","PRE-VETTING NOTICE"],["p","Tip# Before booking the appointment – Consider asking some pre-vetting questions; See our handy PreAppointment Questionnaire"],["p","Remember, this document a guide to assist in building rapport, understanding your clients business and their finance needs. This will help you to ask the right initial questions and guide your conversation with the client. The Documents will need to be customised on their specific circumstances. If you are aware they are wanting to buy Commercial Property the questions can be tailored around the property, purchase price and settlement dates."]]},{"id":"A04","part":"A","t":"Building rapport and relationships with business clients","note":"","b":[["p","Congratulations – you’ve now completed the discovery call with your Business Customer and completed the Pre Appointment Questionnaire; We now want to prepare you for the first meeting to start building rapport and developing strong relationships with your business clients; the more you can learn and understand about their business the stronger you relationship will be."],["p","While publicly available information can provide a solid starting point, asking open ended questions, listening, and taking notes will help you a good credit paper once you return to the office. Whilst your meeting may be about a property purchase/tailor the questions to the client. Here’s some conversation starters you can build into your agenda:"],["h","Understanding the Business"],["p","1. How long have you had the business for? How did you get started?"],["p","Understanding the background/motivation behind their business will help understand their why, their vision, d
