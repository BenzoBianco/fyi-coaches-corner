rive and personal connections"],["p","2. Who do you see as your competition and how do you differ?"],["p","What’s unique about this business, their business services, products or areas covered."],["p","3. What are one or two of the biggest achievements since you started?"],["p","Business owners love talking about their business, their challenges and moments that make them proud, by having a genuine interest and discussing accomplishments – will open your client up to deeper conversations in the future."],["p","TIP# Ask the client about challenges they have faced – Family lifestyle/Long hours/Growing too fast or Cash Flow issues"],["p","4. How many employees do you currently have, and do you have the right team to support the business?"],["p","Depending on the size of the business – you want to open the discussion around the employment structure, FTE’s and reporting structure. This conversation will also let you know if they have the right number of people or any positions vacant – who fills the void and how do they find replacement staff. Tip# Who is the best person to obtain financial information from? The Directors/Accountant or internal staff? Best to ask upfront!"],["p","5. What opportunities exist for your business or the industry in the coming years?"],["p","Gaining insights into their industry and goals will allow you to provide tailored support and solutions to maximize their potential."],["p","6. What do you see as risks for your business or the industry in the coming years?"],["p","Uncovering their concerns or challenges deepens your understanding of their industry and positions you as a trusted advisor."],["p","#Tip – Changes to Government Policy can impact business decisions. Major Infrastructure"],["h","Announcements can also impact business decisions"],["p","7. How will you manage these risks?"],["p","Understanding the risk will allow you to offer relevant assistance if required. Is the risk temporary or permanent – does it impact business cash flow?"],["k","LENDER POLICY COMPLIANCE"],["p","Different lenders may have specific criteria and conditions that affect the suitability of a recommendation for your clients. As a finance broker, it is essential to educate yourself about the lending policy of different lenders before recommending them to your clients."],["p","For Example – You wouldn’t recommend an overdraft facility if your client has ample available cash to support the business. By understanding your clients requirements, you can confidently guide your clients towards lenders that align with their goals."],["h","Here are some initial sources of information to get you started:"],["ul",["Company websites: Explore their website to gain insights into their products, services, and values. Tip # Do they sell products online, offer services or is the website for information?"]],["p","Company searches: A Company and Business Search on the ASIC website will provide key data. ABN/A.C.N, business start date, directors and shareholder data. A PPSR Search will advise who has a charge over the business, their assets or goods."],["p","Company financials: Financial statements tell a story about their income and expenditure. These will help you to understand business assets, liabilities, and what makes up their balance sheet. Tip # Highlight any significant changes between financial years greater than 10% - you can flag these as questions to ask the Directors/Shareholders during your meeting as the conversation develops Company bank statements: Review the last 90 days of bank statements to identify regular"],["p","payments like leasing repayments, insurance premiums, wages, taxes and superannuation"],["p","payments."],["p","Tip# If they have an overdraft ensure they stay within their approved limits. Look for cash flow patterns, how debtors make payments, if they have merchant facilities and potential financial challenges."],["p","Company Debtors and Creditor listings: Its common to ask for 90 Days Debtor and Creditor listings if applicable to the business. Identify their main clients and suppliers, concentration risk and payment practices (Payments made on time/Trading Terms)."],["h","Targeted Questions"],["ul",["Has the growth of the business placed pressure on cash flow?","Are you planning on purchasing any new equipment this year?","Do you own the premises or are you leasing?","What are your insurance premiums looking like this year?","Is your current premises going to be sufficient to operate the business in the short term?","What new markets and/or clients are you targeting?"]],["h","Client Cues"],["p","During conversations with your clients, pay attention to their cues. Listen to what your client is saying and take ample notes. What your clients say in meetings can provide valuable insights into their immediate needs and future plans:"],["ul",["\"Our equipment needs replacing\"","\"We've got five new employees starting this month\"","\"We are considering buying one of our competitor's businesses\"","\"We'll need a few more trucks to keep up with demand\"","\"We're considering sourcing some of our products from overseas\"","\"We definitely need to replace this machine\"","\"This place is not big enough; we'll need to move within the year\"","\"Cash flow is an issue for us at the moment/its tight\""]],["p","By actively listening to your clients' cues and addressing their specific needs and concerns, you can build a strong rapport and forge long-lasting relationships based on trust and understanding."],["p","Remember, building relationships is an ongoing process. Continually engaging in conversations and staying attentive to your clients' evolving needs will solidify your position as a trusted partner in their business journey."]]},{"id":"A05","part":"A","t":"The 5 C’s of credit","note":"","b":[["p","You’ve heard the acronym but what actually are the 5 C’s of Credit and what do they mean. When you write a Credit Paper the 5 C’s of Credit cover the essential information your need to deliver to the lender. Whilst your headings may differ - it's essential to gather comprehensive information from your meetings and source documentation collection to support the transaction."],["p","Here's a guide to help you structure you understand what they mean — FIVE C'S OF CREDIT: Character, Capacity, Capital, Collateral, Conditions."],["h","Character"],["p","The 1st and most important – Who are we lending too? What’s the credit worthiness of the applicant? Who are they, what’s their background, how long have they been in business for, what skills and experience do they have? Are they homeowners, what’s their SP look like for their age? What you are doing here is advising why you are supporting the application – how you have internally assessed the transaction."],["k","ANECDOTE FROM THE FIELD"],["p","“I recall a credit manager saying to me once, Belinda if this was your money – would you lend it to them? In this scenario I’m proud to say yes and could demonstrate the 5 C’s to support my why – but that’s not always the case”"],["p","How trustworthy and reliable are they? Making Statutory payments on time like BAS, SGC, Wages and a good understanding of the business operations – in essence can tell you a great deal about character; as can a Credit Report so ensure you complete one if you have a authority to do so."],["h","Capacity"],["p","Borrowing Capacity. Can your client afford the loan. Do they have Capacity to repay? Capacity or serviceability is commonly based on Historical Financials and Income Tax Returns; Some new assessments include annualising BAS and even projections and cash flow forecasts depending on the situation."],["p","When completing your assessment, you also need to consider non-recurring expenses, non-recurring income and addbacks like interest and depreciation to keep it brief. If buying a property to Owner Occupy, expenses like rent won’t be reoccurring. Assessing business and commercial borrowing is more complex than a home loan – but Cash Flow projections can often be considered. If buying equipment this can often be income generating or assist in the reduction of expenses - like labour or equipment hire. This is where cashflow forecasts can often be considered."],["p","Capacity is often determined through Ratios like the Interest Cover Ratio or Debt Service Ratio. How many times over can the business make the interest or debt commitments on the loan – and again these ratios are calculated using historical figures and forecasts."],["k","UNDERWRITING CALCULATION FRAMEWORK"],["p","Adjusted Cash Flow (EBITDA) = Net Profit Before Tax + Interest Expense + Depreciation + Amortisation + NonRecurring Expenses - Non-Recurring Income"],["p","To assess capacity you should assess with a buffer on the actual rate. As a rule of thumb I use 1.5% - but you will soon discover each lender has their own method. If you wanted to be conservative use a 2% buffer. Other Ratios may also be considered to measure capacity like a “Current ratio” or “Debt to Equity Ratio”. The current ratio measure Current Assets over Current Liabilities. This ratio measures a company's ability to cover its short-term debt obligations. Here 1x cover is acceptable. A 1.5 ratio means the company has $1.50 of current assets for every $1 of current liabilities. The Debt to Equity ratio is measured by dividing the companies liabilities by its equity or shareholder equity. Here 1 - 1.5x and above is acceptable. We want to see a higher ratio of equity than debt. Ratios can also be referred to as covenants in a loan contract to ensure the business continues to meet the Banks Capacity guidelines in future years."],["p","Whats important for a lender to also consider outside of the Ratios in a financial assessment consider is the way out or Exit Strategy. Now this is completely different in Business and commercial assessments to residential loans. When I was a Commercial Banker with one of the Majors we often spoke about 1st, 2nd and 3rd way out for a bank to be repaid."],["p","The first way out is always debt reduction through the borrowing capacity – Cash Flow; Loan Repayments, Savings etc. If the First way out fails and the loan is not being repaid; 2nd Way out refer to Asset recovery. Sale of the Collateral (the 3rd C) held as security or the business. Ideally the Lender has Market Value coverage on the property to fully repay the loan. The 3rd way out is Recourse through Directors Guarantees and their personal assets. Obviously no one wants to be in a position where missed payments and financial hardship/debt repayment or asset sales are in play – however it does happen and needs to be discussed. Customers often confuse Capacity with our 3rd C – Collateral."],["h","Collateral"],["p","This is the Security for the Loan. This is commonly bricks and mortar - property or cash. It can also include specific or general charges over a business and the business assets. Guarantees from related businesses and directors can also be considered. Security/Collateral is one of the most important aspects for commercial lending."],["p","The security supports the loan, its assessed for risk and a lending value is assigned to it. Without the Collateral the lender is left with Risk. How is the loan cleared/closed and repaid in full if the First way out fails? Whilst unsecured lending is available particularly for smaller loan amounts and short-term finance"],["ul",["the assessment for these types of finance differs greatly."]],["p","The quality of the collateral provided does in turn drive risk and in turn, pricing. So we can't have it both ways. The Property is valued for a Banks market value assessment and then a lending Value is assigned. If you haven’t read our brochure, “everything you need to know about LVR’s” now is the time to do so."],["p","Lenders consider the LVR when determining the interest rates, loan terms, and eligibility criteria for borrowers. Higher LVRs indicate higher risk, as borrowers have less equity in the property, making it less likely for them to recover their investment if the borrower defaults. Lenders typically have maximum LVR limits that determine the maximum loan amount they are willing to offer. It varies depending on the type of property, loan purpose, and borrower's financial situation."],["p","As an example an Owner Occupied Warehouse Property with a Market Valuation <$1M, an 80% LVR may be achievable if P&I repayments are part of the term with one lender. Another may only lend 70% of the Market Valuation on the same property."],["p","For transactions above $1M; 65% was once the standard LVR for Commercial Collateral – but not anymore! Depending on the industry, the property usage, and specialisation the LVR’s can differ from as low as 30% on site finance through to 100% for Medico’s. This is where policy and financier play a key role in your 5 C’s of Credit."],["h","Capital"],["p","Capital is Cash! How much Capital can the customer contribute towards the property? Ideally this is the difference between the Purchase Price and the LVR plus costs. Capital can be confused with Collateral – especially if you customer is completing a refinance or has another property to offer as supporting security to cover the full loan amount."],["p","Hurt Money. Capital is the value of assets that a borrower owns, which may include assets (like Cash/term deposits etc) that they pledge to put towards or use as collateral for a loan. Lenders like to see some contribution or \"hurt\" from the borrower and this is where a contribution of capital/cash is desired."],["k","UNSECURED TRANSACTION ANECDOTE"],["p","“I’ve has many the enquiry over the years where potential borrowers come to looking to buy an established business. In all instances they have had no savings; did not own property or their own home and wanted to borrow 100% of the asking price. Whilst their may be a lender who entertains this type of finance – in all instances I’ve said no. Why? For most unsecured lending policies, the applicant needs to be a homeowner for the lender to provide a loan equal to 50% of the Purchase Price if the business is viable. Second to this – if they can’t contribute their hard earnt cash/savings or hurt money - why should the Bank?”"],["p","A material level of deposit for a property purchase etc. For example, a business loan may be supported with a property given by a third party – normally this is the Director or beneficial owner (\"guarantor\"). The Supporting property may be the family home, an investment property or another commercial property of considerable value but without any contribution of capital from the borrower. In this instance, there is a lot of collateral (second way out) but a lack of borrower contribution."],["h","Conditions"],["p","The final c and my favourite. Conditions are often the loan terms. Conditions cover items like the interest rate (Fixed/Variable, Risk margins and line fees), the repayment terms (Principal and Interest, Interest Only, Interest Only in advance) and the purpose of funds, the loan terms, applicable fees and being a finance broker you should also cover off the expected upfront and trail incomes. When you have an approval you should expect conditions to be a part of the loan term. The loan could be set and forget with a specific loan term. If your approval is a “lease doc” product; the loan term is aligned to the current lease term (not the options) or if the rate is aligned to BBSY this may be a shorter loan term designed to keep your clients interest rate as low as possible."],["p","For transactions above $1M and increasingly above $3M – you should expect a 2-3 year loan term with conditions such as a valuation requirement upon renewal. In this space you may also see annual reviews with the bank wanting to test covenants on the most recent financials."],["p","Best practice: Diarise the loan expiry or Annual Review 3 months in advance; like you would for an Fixed Rate maturity. This is to ensure the review is completed on time."],["p","To summarise the 5 C’s of credit, these are crucial aspects to cover, discuss and support your transaction in your credit paper. The majority of lenders review most of this information when assessing any credit request it may just be presented with different headings; ie Background is about character. Funds to complete is Capital and Security is Collateral."]]},{"id":"A06","part":"A","t":"Everything you need to know about LVRs","note":"","b":[["h","(Lending Value Ratios)"],["p","Lending Value Ratio (LVR) refers to the proportion of the loan amount relative to the value of the property being used as security. It is a critical measure used by lenders to assess the level of risk associated with a mortgage or loan."],["h","1. Understanding LVR"],["p","LVR is expressed as a percentage, calculated by dividing the loan amount by the property value and multiplying it by 100. For example, if you apply for a loan of $400,000 on a property valued at $500,000, the LVR would be 80% (400,000 / 500,000 x 100)."],["h","2. Importance of LVR for Lenders"],["p","Lenders consider the LVR when determining the interest rates, loan terms, and eligibility criteria for borrowers. Higher LVRs indicate higher risk, as borrowers have less equity in the property, making it less likely for them to recover their investment if the borrower defaults."],["p","TIP: In Commercial Lending you may pay a higher % rate for a Higher LVR in the SME <$1M Space. Banks may also favour P&I repayments over IO for a Higher LVR."],["h","3. Maximum LVR"],["p","Lenders typically have maximum LVR limits that determine the maximum loan amount they are willing to offer. It varies depending on the type of property, loan purpose, and borrower's financial situation. TIP: Site Finance or Specialised Security your may only be able to achieve a 50% LVR."],["p","For Owner Occupied Properties <$1M an 80% LVR may be achievable if owner Occupied and/Or Willing to pay P&I. 65% was once the standard LVR for Commercial."],["h","4. LVR Thresholds"],["p","Lenders often set different LVR thresholds that impact the borrower's financial arrangements, such as Caps on Vacant Land, Site Finance or Specialised Securities. In the Resi lending space you’re already family with LVR Thresholds at 80% of a Residential Property or lower in some circumstances. In Consumer Lending LMI can apply if a higher LVR is available. LMI is not available for Commercial Lending."],["p","TIP: LMI Is NOT Available in the Commercial Lending Space."],["p","If you client needs a Higher LVR – consider equity release from another property. Banks will consider Higher LVR’s for medico transactions. Strong Cash Flows could be considered for other transactions – however your do need to demonstrate funds to complete in your application just as you do for residential finance. Refer to your recommended banker here for additional guidelines"],["p","Non Bank Lenders will consider Higher LVR’s. As this represents a greater risk to the lender; expect a higher interest rates."],["h","5. Reducing LVR"],["p","To decrease the LVR, borrowers can either increase their deposit or pay down the principal loan amount. This increases the borrower's equity in the property, which reduces their risk profile and may enable them to access better interest rates and loan terms."],["h","6. Risks and Benefits"],["p","Low LVRs provide lenders with more security but may require a larger deposit from the borrower. Higher LVRs allow borrowers to secure a loan with a smaller deposit, but they may face higher interest rates like risk fees or interest rate margins. Additional costs could also apply. Some Lenders like Judo will consider the strength of the transaction and the borrower rather than assigning a flat LVR to your transaction."],["h","7. Impact on Property Investors"],["p","LVRs are particularly relevant for property investors looking to buy multiple properties. Lenders may have stricter LVR limits for investors, requiring them to have a lower LVR than owner-occupiers. TIP: Specialised Policies may also apply like Lease Doc which just considers the Rental Income to service the loan."],["h","8. Professional Advice"],["p","It's advisable your client also seek professional advice from their accountant, solicitor, financial advisors (as Applicable) and yourself as their Mortgage Broker to fully understand their borrowing needs lenders specific LVR requirements, loan options, and applicable regulations based on their circumstances."],["p","Remember – Ask Questions!! LVRs are just one aspect lenders consider when assessing loan applications. Other factors like income, credit history, security, lease terms, stability also play a crucial role. Policy differs from Lender to Lender – it’s not a one size fits all approach and each scenario in unique."]]},{"id":"A07","part":"A","t":"Ratios when completing a financial analysis","note":"","b":[["p","When completing a financial analysis, there are several ratios that can provide valuable insights into a company's financial health. Here are seven commonly used ratios and their meanings:"],["h","1. Current Ratio"],["p","This ratio measures a company's ability to cover its short-term obligations. It is calculated by dividing current assets by current liabilities. A ratio greater than 1 indicates the firm has enough current assets to meet its short-term debts. The current ratio measures Current Assets over Current Liabilities. This ratio measures a company's ability to cover its short-term debt obligations. Here 1x cover is acceptable. A 1.5 ratio means the company has $1.50 of current assets for every $1 of current liabilities."],["h","2. Debt-to-Equity Ratio"],["p","It indicates the proportion of debt-to-equity financing used by a company. It is calculated by dividing total debt by shareholders' equity. A higher ratio may indicate higher financial risk as it suggests higher reliance on borrowed funds. Debt to Equity Ratio”. The Debt-to-Equity ratio is measured by dividing the companies' liabilities by its equity or shareholder equity. Here 1 - 1.5x and above is acceptable. We want to see a higher ratio of equity than debt."],["h","3. Gross Margin Ratio"],["p","is also known as the gross profit margin ratio, is a profitability ratio that compares the gross margin of a company to its revenue. It shows how much profit a company makes after paying off its Cost of Goods Sold (COGS). To calculate: Gross Margin Ratio = (Total Revenue - COGS) / Total Revenue. What determines a Solid Gross Profit Margin here will depend what industry they are in; but you can compare they results for the same client against previous years and any forecasts."],["h","4. Return on Assets (ROA)"],["p","This ratio measures a company's profitability in relation to its total assets. ROA is used to determine whether a company uses its assets efficiently to generate a profit. You can calculate a company's ROA by dividing its net income by its total assets. In general, the higher the ROA is (above 5%), the more effective the company is at generating profits."],["h","5. Return on Equity (ROE)"],["p","is the measure of a company's net income divided by its shareholders' equity. This Ratio is a tool to evaluate investment returns of a company within a particular industry. A higher ROE signals that a company efficiently uses its shareholder's equity to generate income. Low ROE means that the company earns relatively little compared to its shareholder's equity"],["h","6. Interest Cover Ratio"],["p","The most common cashflow ratio to measure Capacity or Serviceability. ICR is used to measure how many times a Company or Business can pay the interest due on outstanding debt. The interest coverage ratio is calculated by dividing a company's earnings before interest and taxes (EBIT) by its interest expense during a given period – normally a financial year. 2x cover and above indicates a good pass. Here all lenders' policies will differ from 1.5x and above."],["h","7. Debt Service Ratio"],["p","Sometimes we save the best till last. If your client is paying Principal and interest reduction we need to consider the DSR. DSR shows the lenders if a business/company has enough income to pay its debts. The DSR is calculated by dividing a company's earnings before interest, taxes, depreciation and amortisation (EBITDA) by its principal and interest expenses during a given period – normally a financial year. 1x cover and above indicates a good pass. Again, lenders' policies will differ from 1x and above. We also discussed Ratios in our Chapter/Brochure on the 5 C’s of Credit. Remember - Capacity is often determined through Ratios like the Interest Cover Ratio or Debt Service Ratio. How many times over can the business make the interest or debt commitments on the loan – and again these ratios are calculated using historical figures and forecasts."],["p","To assess capacity, you should assess with a buffer on the actual rate. As a rule of thumb, I use 1.5% but you will soon discover each lender has their own method. If you wanted to be conservative use a 2% buffer. Other Ratios may also be considered to measure capacity like a “Current ratio” or “Debt to Equity Ratio”. (discussed above)."],["p","Ratios can also be referred to as covenants in a loan contract to ensure the business continues to meet the Banks Capacity guidelines in future years; particularly if you client is subject to annual reviews of their lending."],["p","These ratios provide a snapshot of different aspects of a company's financial performance and are useful in assessing its liquidity, solvency, profitability, and return on investment. However, it's important to consider industry norms and compare ratios to peers for a more meaningful analysis."]]},{"id":"A08","part":"A","t":"10 hot tips about commercial property finance","note":"","b":[["h","1. Understand their financial goals"],["p","Are your clients buying to occupy or invest? Determine their objectives and assess how commercial property finance aligns with them. Is Capital Growth important, the rental yield or business security?"],["h","2. Assess their borrowing capacity"],["p","Take a close look at their financial situation and determine how much they can afford to borrow, the LVR, Funds to complete and their Capacity to repay the loan."],["h","3. Research lending institutions"],["p","Explore the options available to you and compare interest rates, fees, and loan terms from different lenders. This is not exhaustive list and Commercial Lenders available may differ depending on your aggregator. Ensure you are accredited or can obtain accreditation. Major Banks to consider for finance solutions include ANZ, CBA, WBC and NAB. Non-Majors include Judo, ING, St George, BOM, Suncorp, BOQ. Medfin & Macquarie. Non-Bank Lenders include Latrobe, Liberty, Granite, Thinktank and ORDE."],["h","4. Credit Memorandum"],["p","Write your credit paper - even if its brief to begin with. This should cover the 5 C’s of Credit; this can be brief initially to obtain indicative appetite and lenders terms including rate and fees. Lenders will want to see well-thought-out notes that demonstrate your client’s viability for the commercial or business finance. Tip # Refer to our Brochure the 5 C’s of Credit"],["h","5. Location"],["p","Location plays a crucial role in commercial property purchases and refinances. Research the location and postcode. Are there restrictions in this area? Is it a metro, regional or remote location. The location can impact the Lending Value Ratio and Terms of the Loan."],["h","6. Property type"],["p","The Property Type also plays a crucial role in the security risk of the property and if it’s deemed to be specialised. The Property type can impact your Lending Value Ratio and also the lenders appetite. Is the property a standard Commercial like: Shop, Retail, Office, Factory, Warehouse, Industrial, Medical or Consulting suites? Or specialised like: Hotel, Motel, Leisure, Petrol Station, Childcare etc."],["h","7. Property Yield"],["p","Look at the potential rental income, the lease term, options to renew and who pays the outgoings like Council Rates, Water, building insurance, Land Tax and if GST is applicable. You client should also be reviewing the Section 32 in the contract before signing the contract. Do the terms align with their goals?"],["h","8. Lender Risk"],["p","While the client will conduct thorough inspections and evaluations of the property - ensure there are no hidden issues that could affect its value, risk, or impact your client. Things to consider are Asbestos, Soil Contamination or unrepaired damage."],["h","9. Consider multiple financing options"],["p","Consider more than 1 lender for your client’s scenario. Which lender is in their best interest. What terms and rates have been presented? What loan terms are on offer and is a Valuation Required – How long will the report take? Explore different financing options such as traditional bank loans, second tier lender commercial mortgages or private financiers depending on the availability or complexity of financial information. Tip # Are any government grants or Stamp Duty Concessions available for your client?"],["h","10. Ensure your client seek professional advice"],["p","Whilst it’s important to consult with experienced professionals like us – Finance Brokers. Other Professionals who make up your client’s team of Trusted Professional Advisors Include their Accountant, real estate agents and/or Buyers Agent and Property Lawyer. Tip# Do you have a pre prepared list of Professional Service Providers, you can recommend?"],["p","Remember, it's essential to do your own research and tailor these tips to your client’s specific situations. Keep an eye on the market and be aware of any changes in regulations, interest rates, or other factors that could impact your client’s commercial property finance decisions."]]},{"id":"A09","part":"A","t":"7 things to consider when reading a commercial contract of sale","note":"","b":[["p","Introduction: Reading and understanding a commercial contract of sale is crucial before making any business transaction. This brochure will highlight seven important considerations you should keep in mind during the process."],["h","1. GST (Goods and Services Tax)"],["p","Ensure you understand the GST implications within the contract. Determine whether the stated price is inclusive or exclusive of GST and if you are eligible for input tax credits."],["h","2. The Purchaser"],["p","Review the contract to identify the parties involved. Pay attention to the purchaser's details, such as legal names, corporation or individual status, and any special conditions that may affect the transaction. Tip# Check if you your client has obtained accounting advice around the structure first"],["h","3. Finance Clause"],["p","Check for any finance-related clauses within the agreement. Understand the terms, including the timeframe to secure financing, the amount required, and the consequences if financing falls through."],["h","4. Settlement Date"],["p","Take note of the settlement date mentioned in the contract. It is crucial to be aware of the agreed-upon date on which the property's ownership transfers and any conditions or penalties tied to meeting this deadline."],["h","5. Number of Titles Applicable"],["p","Check the number of titles associated with the property. Understand if multiple titles are involved, as this may impact ownership rights, zoning regulations, and future development potential. All title need to be included in the mortgage documents"],["p","Tip# This can be crucial with SMSF Lending as additional Bare Trusts may be required"],["h","6. Review for Leases"],["p","Pay attention to any existing leases that may apply to the property. Review the contract carefully to understand the terms, duration, and obligations outlined in these leases, as they may affect your use or income potential from the property."],["p","Tip# A valid lease on a Commercial can often negate the need for GST to apply to a property purchase"],["h","7. Miscellaneous Clauses"],["p","Thoroughly read and understand any additional clauses in the contract. These may include special conditions, dispute resolution processes, and other relevant information that might affect your decision to proceed with the sale."],["p","Conclusion: Reading a commercial contract of sale carefully is vital to protect your interests. Ensure you seek legal advice if you are uncertain about any clauses or terms within the agreement."],["p","Remember, it's essential to review the GST implications, understand the purchaser details, consider the finance clause, be aware of the settlement date, know the number of titles applicable, carefully review any leases that may apply, and take note of any miscellaneous clauses mentioned. By following these tips, you will be better equipped to navigate commercial contracts of sale effectively and make informed decisions."],["p","Please note that this brochure serves as a general guide, and it is recommended to consult with a legal professional for specific advice related to your situation."]]},{"id":"A10","part":"A","t":"5 things you need to know about commercial SMSF lending","note":"","b":[["p","Introduction: Commercial SMSF (Self-Managed Superannuation Fund) lending allows your client to invest in commercial or residential properties. This brochure will highlight five important things you need to know about commercial SMSF lending."],["h","1. The SMSF Fund"],["p","Understand the rules and regulations governing SMSFs. Ensure your SMSF is compliant with all relevant laws, including contribution limits, investment restrictions, and other requirements set by the Australian Tax Office (ATO). The Fund needs to be in accumulation phase – or at least 1 member – not pension phase."],["p","TIP # You can check the compliance of your clients SMSF by visiting the website:"],["h","https://superfundlookup.gov.au/"],["h","2. Bare Trust"],["p","Is the borrowing Entity. The SMSF must establish a Bare Trust, also known as a Custodian Trust, for any property purchase. This trust separates the SMSF from the property ownership and restricts the SMSF's role to being the beneficial owner. Seek accounting or legal advice here to ensure the trust is correctly structured."],["h","3. GST (Goods and Services Tax)"],["p","Consider the implications of GST on commercial SMSF purchases. Determine if the property purchase price is inclusive or exclusive of GST and whether your SMSF is eligible for input tax credits."],["h","4. Rental Income"],["p","Understand how rental income from commercial properties will flow into your SMSF. Review the lease terms, rental rates, and tenant quality to ensure the property will provide a steady income stream for your SMSF."],["h","5. Lender's Requirements"],["p","As a finance broker, it is crucial to have a deep understanding of the lending policy associated with commercial SMSF loans. Different lenders may have specific criteria and conditions that affect the suitability of a loan for your clients' SMSFs. Before recommending a lender, carefully review their lending policy to ensure it aligns with your clients' needs and SMSF requirements."],["p","Consider factors such as loan-to-value ratios, liquidity ratios, property types that the lender accepts, income being received by the SMSF, interest rates, and any additional fees or charges. Being fully informed about the lending policy of various lenders will enable you to provide well-informed advice and select the most suitable lender for your clients' commercial SMSF lending needs."],["p","Conclusion: Commercial SMSF lending offers a valuable opportunity to diversify superannuation investments. As a finance broker, it is essential to educate yourself about the lending policy of different lenders before recommending them to your clients. By understanding their requirements, you can confidently guide your clients towards lenders that align with their SMSF and investment goals. Please note that this brochure serves as a general guide, and it is recommended to remain up to date with the lending policies of various lenders and consult with industry professionals for specific advice related to commercial SMSF lending. Feel free to copy and use this brochure. If you have any further questions or need additional assistance, please let me know!"]]},{"id":"A11","part":"A","t":"Equipment finance","note":"","b":[["h","Mastering Asset Finance Structures & Client Qualification"],["p","Diversifying into commercial equipment finance is one of the fastest ways to scale your brokerage. Unlike residential lending, asset finance offers quicker turnaround times, shorter sales cycles, and provides immediate value to business clients expanding their operations."],["k","CORE PRODUCT MATRIX"],["h","A. Chattel Mortgage (Goods Loan)"],["h","Ownership: Client from Day 1"],["h","Security: The Asset Itself (Registered on the PPSR)"],["p","Overview: The Chattel Mortgage is the most popular equipment finance structure in Australia for business entities. The client takes legal ownership of the asset immediately upon delivery, and the lender secures the loan by registering a charge (mortgage) over the \"chattel\" via the Personal Property Securities Register (PPSR)."],["p","Broker Insights: Best suited for businesses using cash-basis accounting who want to claim the full upfront GST input tax credit on their next Business Activity Statement (BAS), as well as utilizing depreciation and interest deductions. The Tax Invoice from the Supplier is made out to the Borrower."],["h","B. Commercial Hire Purchase (CHP)"],["h","Ownership: Lender during term; transfers to client upon completion"],["p","Overview: Under a CHP structure, the lender purchases the asset and hires it back to the client for a designated term. The client has full operational use of the asset, but legal ownership only transfers to the client once the final payment (including any balloon/residual amount) is cleared."],["p","Broker Insights: Less common now due to historic GST changes (GST is usually applied to the interest and fees component over time depending on accounting structures), but still utilized by businesses using accruals-based accounting wanting structured milestone handovers."],["h","C. Finance Lease"],["h","Ownership: Lender retains ownership; Client rents the asset"],["p","Overview: A Finance Lease is a rental agreement where the lender owns the asset, and the client pays a monthly lease fee to use it. At the end of the lease term, the client must pay a predetermined residual value (set by ATO guidelines) to acquire the equipment, trade it in, or extend the lease. Broker Insights: Ideal for clients who want to keep capital expenditure off the balance sheet (depending on accounting standards) and treat lease payments as a 100% tax-deductible operating expense."],["h","D. Insurance Premium Funding (IPF)"],["h","Ownership: N/A (Intangible Service Short-Term Loan)"],["p","Overview: IPF is a specialized, short-term loan (typically 8 to 12 months) that enables a business to spread the upfront cost of their annual commercial insurance policies (e.g., work cover, professional indemnity, public liability) into manageable monthly instalments. The insurance policy itself acts as the primary security."],["p","Broker Insights: An exceptional cross-selling tool. It protects your client’s working capital while providing you with an additional regular revenue stream every year during annual policy renewals. Limited Lender Offering"],["k","2. THE BROKER'S QUICK QUALIFICATION CHECKLIST"],["p","When chatting with a commercial client about equipment finance, ensure you capture these four foundational metrics to determine standard eligibility:"],["ul",["ABN Status: Is the ABN active? Is the business registered for GST? (A minimum of 24 months active is preferred for low-doc policies).","Asset Profile: Is it a Tier-1 asset (cars, light commercial vehicles, standard forklifts, trucks) or specialised equipment (yellow goods, medical lasers, manufacturing lines)? Tier-1 qualifies for easier low-doc loans.","Property Ownership: Does the director own residential property? \"Asset-backed\" borrowers access significantly lower interest rates and faster approvals.","Age of Asset: Is the equipment brand new or used? The age of the Asset and the ATO Life of the Asset can play a role here."]],["k","3. TOP TIP FOR NEW BROKERS: LOOK FOR \"LOW-DOC\" PATHWAYS"],["p","Many prime asset lenders offer \"Low-Doc\" express pathways for clean commercial profiles. Think – Drive Xpress with Westpac and ABCD with CBA."],["p","If your client has an active ABN for more than 2 years, is a property owner, and is purchasing a standard vehicle or piece of machinery under $150,000, you can frequently secure an approval within 24 hours without needing full tax returns, BAS statements, or complex financial updates. An Affordability declaration is required to be signed with a Privacy Consent."],["p","Getting Paid – When returning Loan Contracts to the lender, your need to ensure you send in an RCTI for your Brokerage. Ask Questions – you also need to know if any Rebates are payable, or VBI’s which you may not have received before."],["p","Accreditations – May not be available until you have volume. You can start with other options that work for your client like Quick AF, Dynamoney, Finance One, Pepper and Angle Finance just to name a few! BDMs: Are great resources to learn more about lender quoting, systems, processes and turnaround times. Don’t be scared to ask about policies and processes to ensure a smooth application process for both you and your client."]]},{"id":"B12","part":"B","t":"Your brand, reputation and professionalism","note":"","b":[["h","1. Your Brand, Reputation & Professionalism:"],["p","In the competitive landscape of credit submissions, the first impression we make on a lender isn’t just about the numbers—it is about the narrative we present. Every submission we put forward carries our brand identity. When we approach banks and financial institutions, our professionalism acts as a silent advocate for the quality of our clients and the integrity of our work."],["p","Lenders & Banker alike review countless applications daily. A sloppy, unbranded, email or poorly formatted submission signals a lack of care, knowledge and professionalism, which can immediately invite extra scrutiny, longer turnaround times, or even outright skepticism. Conversely, a polished, meticulously organized, and distinctly branded credit package commands respect. It shows the bank that we are thorough, disciplined, and confident in the deal we are bringing to the table."],["h","Why Professional Presentation Matters"],["h","Building Institutional Trust:"],["ul",["Banks are in the business of managing risk. When a broker delivers a beautifully"]],["p","formatted, clearly structured submission, it signals that the risk has already been"],["p","thoroughly vetted and professionally packaged."],["ul",["Learn from my experience"]],["p","“In my last role as a Commercial Banker at Westpac; I had an acquisition portfolio working with Brokers and their Commercial Transactions. The Quality of work I was presented with to read, vet and price was alarming! New transactions would range from:"],["ul",["an Email with attachments telling me Joe Bloggs wants to buy a Commercial Property"]],["p","an email with a brief, a scenario, some notes, financials, notes about capacity to repay A PDF Credit Submission outlining the Transaction, borrowing entity, serviceability analysis, security details and background of the business and directors."],["p","Each and every time, the scenario that was presented as the Credit Submission took priority! – After reading the document I had confidence in the security, capacity to repay and the background of the applicants – this way I could price the deal to WIN the business quickly. The other two presentations meant a lot of back and forth with the braker before I could present indicative terms and pricing to them ”."],["ul",["Speeding Up Approvals:","Credit assessors appreciate clarity. A professional layout that uses consistent branding, logical headers, and clean formatting allows underwriters to find the information they"]],["p","need instantly, drastically cutting down on back-and-forth queries."],["ul",["Any notes around your financial analysis, understanding the cash flow of the business,"]],["p","ratios, one off expenses or changes in the business are also appreciated by credit"],["p","assessors."],["h","Reflecting Quality and Authority:"],["ul",["Our brand color palette, logo, clean typography, and structured chapters aren't just for aesthetics. They establish our authority in the market. They remind the lender that they are dealing with an elite brokerage that holds itself to the highest industry standards.","Every document that leaves your office should be on brand."]],["h","Protecting Your Reputation:"],["ul",["Every touchpoint with a lender either builds or erodes your reputation. Presenting"]],["p","pristine, branded work ensures that when a bank sees your name on a submission, they"],["p","associate it with reliability and excellence."],["p","Ultimately, protecting our brand reputation means never cutting corners on how we present our work. By maintaining absolute professionalism in every document, we secure stronger relationships with banks, smoother pathways for our credit submissions, and better outcomes for our clients. Which leads us into the why – why we have business documents templated. So lets have a look at some of these:"]]},{"id":"B13","part":"B","t":"The engagement letter and mandate letter","note":"","b":[["h","1. The Engagement letter:"],["p","Using an engagement letter (often referred to as a mandate letter in our industry) is a best practice for establishing a professional client relationship. It serves as a legally binding contract that outlines the scope of services, responsibilities, and terms of the engagement."],["h","Key Benefits of an Engagement Letter"],["ul",["Defines Clear Scope and Prevents Scope Creep"]],["p","o Explicitly details what services are and are not included. This protects your firm from being pulled into performing extra, uncompensated work without a formal agreement."],["h","Sets Clear Expectations"],["p","o Aligns both parties on deliverables, timelines, milestones, and the specific outcomes the client can expect, reducing the likelihood of misunderstandings or mismatched"],["p","expectations."],["h","Mitigates Legal and Professional Liability"],["p","Serves as a vital risk-management tool. It establishes the legal boundaries of your duty of care and often includes clauses limiting liability, managing conflicts of interest, and handling dispute resolution."],["h","Clarifies Financial Terms and Payment Structure"],["p","o Outlines fee structures (e.g., hourly rates, flat fees, retainers, or success fees), billing schedules, expense reimbursements, and consequences for late payments to ensure"],["p","cash flow predictability."],["h","Establishes Professionalism and Authority"],["p","o Presenting a comprehensive, professional agreement right at the onboarding stage"],["p","demonstrates competence, organisation, and high standards, building immediate trust"],["p","with new business clients."],["h","Outlines Client Responsibilities"],["p","o Clearly states what you need from the client—such as timely access to financial records, documents, or approvals—protecting your team from delays caused by client inaction."],["h","Ensures Regulatory and Compliance Alignment"],["p","o Helps meet professional body guidelines and regulatory requirements by documenting"],["p","formal terms of service, confidentiality commitments, and data protection policies (such as GDPR or privacy compliance)."],["ul",["Meet our client: Chris & Tara Smith"]],["p","Here we are introducing you to our fictional clients – Chris and Tara Smith:"],["ul",["Chris & Tara wish to buy a Commercial Property in Pakenham for $1.5M","The Property will be Owner Occupied. Their Accountant has referred them to ABC Finance Group Pty Ltd to organize the funding they will require.","The Applicants operate a plumbing business."]],["h","Their Principal Business is CTS Services Pty Ltd"],["p","Their Accountant has recommended they establish a new entity to purchase the Property in; this company entity is being established. Their chosen name is CTS Property Pty Ltd"],["p","You’ll learn more about the clients and their business as we progress through the journey of their property purchase."],["p","Each and every detail in this scenario is fictional. The clients name, their addresses and their business is fictional for the purpose of providing a sample scenario for you to learn from."],["h","Mandate Letter:"],["p","Whilst I do not use a Mandate Letter in my business, they can be simple or detailed like the engagement letter. One could argue they are the same."],["h","A mandate letter can be as simple as:"],["p","I, «full_name», directors of Company A Pty Ltd hereby authorize «loan_writer» from Company B Pty Ltd to arrange our finance with Lender C moving forward and also authorise «loan_writer» to access the current limit set in place for us (If applicable)."],["p","I am not proceeding with any other finance applications with any other finance company and I agree to deal with Company B Pty Ltd solely moving forward."],["h","Key Benefits of a Mandate Letter:"],["ul",["Sets Clear Expectations and authority."]],["p","o Advises the Lender that the Applicant is dealing exclusively with the Mortgage Broking Business and that the applicant has no other active applications in progress."],["ul",["In June 2026 the Connective Commercial and Asset Finance Team advised, “we are seeing an increasing number of instances where multiple parties are approaching the same opportunities, creating channel conflict and confusion in the commercial space."]],["p","It might be worth considering securing a formal mandate or letter of authority/engagement from your clients before introducing opportunities. This provides clarity on representation, reduces duplication of effort, and helps ensure all parties are working with aligned expectations”"],["p","Ample Sample Document are available within Mercury and Cito Plus."],["p","Our advice is not to be shy about the mandate letter and obtain your clients signature so you can proceed with confidence with their transaction."]]},{"id":"B14","part":"B","t":"Financial analysis","note":"","b":[["h","Financial Analysis:"],["p","In part A of this booklet, we taught you about some common ratios when completing a financial analysis, there are several ratios that can provide valuable insights into a company's financial health; These were the:"],["ul",["1. Current Ratio","2. Debt-to Equity Ratio","3. Gross Margin/Profit Ratio","4. Return on Assets","5. Return on Equity","6. Interest Cover Ratio","7. Debt Service Ratio"]],["p","But how do you actually complete a Financial Analysis?"],["p","There are now ample systems available to assist you – but you should learn the how – and then figure out it you want software to help you or not. Cito Plus and CLE are two such systems which offer Credit Memo Writing and Financial Analysis of Commercial Transactions."],["p","Let’s look at a set up using the simplicity of EXCEL!!"],["p","Above we have set up the Financial Data of CTS Services Pty Ltd in Excel so we can compare the Figures from 2025, against 2024 and 2024 against 2023."],["p","Quickly we can see the 3 years tell us a story."],["p","What insights are the figures telling you right now?"],["ul",["knowing this is a Plumbing Services Business?"]],["p","Next: we want to look at their borrowings and if they can afford to buy a property for $1.5M"],["h","The Scenario"],["p","Here we are introducing you to our fictional clients – Chris and Tara Smith:"],["ul",["Chris & Tara wish to buy a Commercial Property in Pakenham for $1.5M"]],["h","Borrowing Entity - CTS Property Pty Ltd"],["h","Property Address: 1 Michael Street, Pakenham Vic 3810 (Metro)"],["p","The Property will be Owner Occupied."],["h","Applicants want to borrow 80% of the Purchase Price (If possible)"],["h","They prefer Principal and Interest Repayments"],["h","A Long Loan Term is preferred"],["p","The Property is a new Warehouse located close to the Princes Highway."],["h","Warehouse – (1662 m2 approx.)"],["h","Concrete Prefab Industrial Warehouse"],["h","Zoned industrial 1"],["p","Excellent internal height with large roller doors and Personal Access door."],["p","*Each and every detail in this scenario is fictional. The clients name, their addresses and their business is fictional for the purpose of providing a sample scenario for you to learn from."],["h","Sources and Uses of Cash: Funding Table"],["p","Before we jump into capacity to repay or serviceability, how much do they need to borrow? What does their Funding Table look like?"],["p","This table gives us so much information."],["p","1. Their Funds required to complete the transaction."],["p","2. This includes GST – Does GST Apply? You need to find out. They are buying for OO"],["p","Purposes. The Scenario above does not mention if an existing lease is in place as it’s a new build. Is the Vendor registered for GST. This is a conveyancing/Property Law Question."],["p","i. TIP – Review the COS/Reach out to the Conveyancer."],["p","ii. If you are still unsure – Include the GST."],["p","iii. Typically, clients pay this and claim it back on their next BAS if they are"],["p","registered for GST."],["p","iv. The borrowing entity is newly registered – check with the client accountant"],["p","if they will be registered/able to claim the GST back."],["p","3. Regional Locations have a 50% Stamp Duty Concession available in VIC. We noted this locale as Metro for this purpose. Other States like SA do not charge Stamp Duty on Commercial"],["p","Properties."],["p","4. Be aware of CIPT in Victoria. This is a 10 year Tax/Some properties may not have Stamp duty Apply and will have CIPT payable instead. They could have both depending on the date of purchase."],["p","5. If you are charging an Engagement/Mandate/Broker Fee include it in the Funding Table. 6. Sundry Costs allowed are for: Conveyancing/ Bank Application Fee/ Commercial Valuation and any Broker Fee. The Fee quoted above may be to low – What are your thoughts?"],["p","7. The Funding table advises your client needs to contribute $541,244 towards the purchase. i. Do they have these funds?"],["p","ii. Where are the funds located?"],["h","Capacity to Repay: Serviceability"],["h","Interest Cover Ratio"],["p","Every bank has a different measure for assessment. Here we are using a mid-range rate to calculate the Interest Cover Ratio and the Debt Service Cover Ratio. Some Banks will use a floor rate. Others will use actual rate plus a buffer of 1.5% - 3.00%."],["p","ICR is the most common cashflow ratio to measure serviceability. The ICR tells you how many times a Company or Business can pay the interest due on outstanding debt. The interest coverage ratio is calculated by dividing a company's earnings before interest and taxes (EBIT) by its interest expense during a given period – normally a financial year. 2x cover and above indicates a good pass. Here all lenders' policies will differ from 1.5x and above. I would consider a 1.5x ratio a marginal pass."],["h","Debt Service Ratio"],["p","This client specifically requested principal and interest repayments. The Debt Service Ratio (DSR) ratio is really important – to prove the repayments are affordable for the business. Put simply the DSR shows a lenders if a business/company has enough income to pay its debts."],["p","The DSR is calculated by dividing a company's earnings before interest, taxes, depreciation and amortisation (EBITDA) by its principal and interest expenses during a given period – normally a financial year. 1x cover and above indicates a good pass. Again, lenders' policies will differ from 1x and above."],["p","Can CTS Services afford the new loan repayments?"],["p","The ratio’s present as strong. 3 x ICR on the 2 most recent years and close to 3 x DSC."],["p","If we removed the Excavator Payment, the DSC is almost 3 x."],["p","Note: The assessment is based on CTS Services Pty ltd as this is where the income is generated. CTS Property Pty Ltd is newly established. Typically, the core business will “rent” the new premises from the property owners. Good businesses will prepare a Commercial Lease with Terms, Payments and conditions."]]},{"id":"B15","part":"B","t":"Writing a credit memorandum","note":"","b":[["h","Writing the Credit Memorandum:"],["p","Let’s first recap, how far we’ve come to date."],["ul",["You’ve met and interviewed your first client and started to build a relationship with them. The Engagement letter has been prepared and signed."]],["h","The supporting documents have been collected"],["p","The financial Analysis and their funding table is now completed."],["p","It’s now time to bring together everything you have learnt about Chris and Tara Smith and their business C&T Services Pty Ltd and write their credit memorandum."],["p","It’s also a good time to refresh yourself with the 5 C’s of Credit!!"],["p","FIVE C'S OF CREDIT: Character, Capacity, Capital, Collateral, Conditions."],["p","The whole purpose of the Credit Memorandum is to present this client to a lender demonstrating the 5 C’s of credit – and why this is a bankable transaction,"],["p","Please review the attached Credit Memorandum and let’s discuss if we covered enough."],["p","I’ve not gone into huge detail around Collateral – We know Michael Street will be the security property offered – but can you tell me which two documents the lender will receive providing information on Collateral?"]]},{"id":"B16","part":"B","t":"The tender process","note":"","b":[["h","The Tender Process"],["h","Business Template Documents"],["p","Now that your have completed a financial assessment and completed the Credit Memorandum; its time to tender the document to different lenders and obtain some terms you can present back to your client."],["p","The Tender Document is the Credit Memo. We present the Credit Memo to the different banks as it outlines; the 5C’s of Credit. We introduce the transaction to the Banker either via email in person. Discussing the deal and advising your like competitive pricing and terms within 5 business days. The importance of this process is that it:"],["h","1. Drives Competitive Pricing"],["p","When lenders know they are in a competitive bidding environment, they are forced to put their best foot forward. A tender process creates a \"buyer's market\" dynamic, allowing the business to drive down interest rates, reduce establishment fees, and minimise ongoing facility costs. Even a marginal reduction in interest rates can save a business tens or hundreds of thousands of dollars over the life of a commercial loan."],["h","2. Secures Favourable Terms and Flexibility"],["p","Business lending is rarely just about the interest rate. The terms and conditions of a loan can heavily impact a company's day-to-day operations. Through a tender, businesses can negotiate:"],["ul",["Financial Covenants: Giving the business more operational breathing room."]],["p","Better Security Structures: Minimising the amount of collateral or personal guarantees required by the lender."],["p","Favourable Repayment Schedules: Aligning amortisation (repayment) schedules with the"],["p","business's actual cash flow cycles."],["h","3. Tests the Incumbent Lender"],["p","Many businesses fall into the trap of \"bank loyalty,\" returning to their existing bank for new capital because it is convenient. However, incumbent banks often become complacent and may not offer the best market rates to existing clients. A tender process keeps the current lender honest by benchmarking their offer against the broader market. Often, just the threat of a tender will prompt an existing bank to suddenly offer a better deal."],["h","4. Accesses Innovative and Tailored Solutions"],["p","Different financial institutions have different risk appetites, industry expertise, and product suites. By going to tender, a business might discover that Lender A offers a standard term loan, while Lender B proposes a highly tailored mix of equipment finance, invoice financing and revolving credit that solves the company's cash flow problems much more effectively."],["h","6. Diversifies Funding Sources"],["p","Relying entirely on a single lender is a concentration risk for any business. If that bank changes its lending policies or decides to reduce its exposure to your industry, your business could be left stranded. A tender process allows a company to build relationships with alternative lenders or secondary banks."]]},{"id":"B17","part":"B","t":"The importance of bank relationships","note":"","b":[["h","The importance of Banking Relationships"],["p","In this industry, it’s important to build relationships with your Commercial Business Development Managers (BDMs) and Bankers. BDM’s and Bankers are a wealth of knowledge and often experts in their credit policies."],["p","If you’re curious if a transaction fits with a particular lender – often a phone call can answer your questions."],["h","Key Benefits of Strong Banking Relationships"],["ul",["Escalations & Priority Processing: When settlement deadlines are tight or property valuation disputes occur, direct BDM relationships allow brokers to escalate files past standard queue delays."]],["p","Streamlined Query Clearance: When credit assessors’ issue “Requests for Information”, having rapport with credit teams helps resolve complex income questions or documentation nuances rapidly."],["p","Better Access to Credit and Financing: When you have a new client to introduce – the BDM or a Banker you deal with knows your past transactions introduced to the Bank and the quality of your submissions. Your professionalism, deal quality and presentation of new transactions is far more likely to have finance approved and provide favourable pricing."],["p","Personalised Service and Expertise: A dedicated banker or relationship manager acts as a single point of contact. They can guide you through complex financial scenarios, recommend tailored solutions and help you from navigating customer service processes."],["p","Fee Waivers and Preferential Rates: BDM’s will reach out to their regular Brokers to advise of promotions, new products, fee waivers and available rebates."],["p","Streamlined Business Operations: For businesses, a strong banking partner facilitates smoother payroll processing, merchant services, treasury management, and international trade finance, ensuring daily operations run seamlessly."],["p","Have a partnership approach: A great banker understands the Broker is your client and work in partnership with you the Broker, the client and the Bank."]]},{"id":"B18","part":"B","t":"Pricing and presenting options to your clients","note":"","b":[["h","Pricing and Presenting options to your clients"],["p","Let’s first recap, how far we’ve come to date."],["ul",["You’ve now written the Credit Memorandum and tendered the information to a number of"]],["h","Banks"],["p","Its now time to collate this information and present the information back to your client. This information is presented in a document; for your client’s decision."],["ul",["CTS Property Pty Ltd"]],["h","Here we revisit our clients– Chris and Tara Smith:"],["ul",["Commercial Property in Pakenham for $1.5M"]],["h","Loan Amount $1.2M"],["h","Principal and Interest Repayments"],["h","A Long Loan Term is preferred"],["p","*Each detail in this pricing document is fictional."],["p","It is up to you the Broker to obtain current and accurate information from each lender to suit your clients scenario."]]},{"id":"B19","part":"B","t":"The application process: approval to settlement","note":"","b":[["h","The Application Process:"],["p","Now that you client has advised of their preferred lender – Its time to put the application together and lodge with the Bank."],["h","Application Forms/Checklists and Supporting Documents:"],["ul",["Complete the Application Form in Full."]],["p","Complete the Checklists and Submit with all documents avoiding any re-work and delays."],["p","Submit your Credit Memorandum with the supporting documents."],["p","Follow up with the Banker to ensure the obtain the Valuation Quotes for your application. Obtain any SLA’s so you can communicate timeframes with your client."],["p","Review against important Dates like Finance Clause and Settlement Dates."],["p","Communication with you BDM and Banker here are key."],["h","Approval:"],["ul",["Download and save any approval document and advise your client."]],["p","Obtain SLA’s around Document Preparation."],["p","Advise any Lawyer/Conveyancer of the Formal Approval."],["p","Loan Contracts: The lender will next issue the Loan Contracts. These documents may contain commercial loan agreements, corporate and personal guarantees, and mortgages. Ensure you review the documents for pricing, fees and repayment details; that the line up with your expectations. Discharge Authority: If the new business loan is refinancing existing commercial debt or lines of credit from another institution, this authorises the old bank to release their security over business assets. Ensure this is completed and lodged in a timely fashion – as it can cause delays."],["p","Insurance: The business provides proof of required commercial policies—such as key person insurance, public liability, or asset/property insurance—with the bank noted as an interested party. Guarantees: Because business entities carry commercial risk, directors or parent companies typically must sign Director's Guarantees and Indemnities making individuals personally or structurally liable for the facility. The Guarantee will have formed a part of your approval. A General Security Agreement may also be included for the lender to take a charge over the borrowing entity."],["p","Legal Advice: Lenders often require independent legal and financial advice certificates to ensure company directors and guarantors fully understand their liability under the business loan terms. Settlement Conditions: Read the settlement conditions carefully. Depending on the transaction you may need to address covenants, annual reviews or relay clear instructions to your client around what the lender required before settlement. Commonly Settlement Conditions maybe Building Insurance with the lender noted as Mortgagee on the Policy."]]},{"id":"B20","part":"B","t":"Post settlement: nurture","note":"","b":[["h","Post Settlement:"],["p","Post Settlement is about Nurture."],["p","Ensuring a smooth transition post-settlement is key to building long-term client trust and satisfaction. Key Check-In Points"],["p","First Repayment Confirmation: Confirm that the initial direct debit has successfully cleared from their nominated account without any hiccups."],["p","Banking Access: Verify that they have successfully logged into the online banking Portal or mobile app, set up online banking and opened any required bank accounts. Do they know how to navigate the banking app?"],["p","Open Floor for Questions: Explicitly ask if they have any lingering questions about their loan structure, repayment schedule, or lender features."],["ul",["What Else Might You Be Missing?"]],["p","To ensure a truly comprehensive post-settlement experience, consider adding these crucial steps to your workflow:"],["p","Document Archiving: Provide the client with a neat digital folder containing their loan contract, settlement statement, and key contact numbers for the lender."],["ul",["TIP:","Looking for more Accountant Referrals?"]],["p","We Recommend providing the same package to your client’s accountant."],["p","It saves your client time when preparing financials, it’s a further contact with the accountant’s office and no doubt they’ll be impressed with your forward thinking!"],["ul",["A quick phone call combined with a follow-up email 7-10 days post settlement usually yields the best engagement, catching any early teach or repayments issues before the become frustrations."]],["p","Broker/Lender Distinction: Gently remind them of who to contact moving forward (e.g.,"],["p","reaching out to you for future reviews or refinancing, and contacting the lender directly for dayto-day transactional support). Rate & Product Review Reminder: Set an internal CRM reminder to check in at the 6-month or 1-year mark to review their rate or fixed-rate expiry dates."],["p","Google Review/Referral Request: Once you confirm they are completely happy, invite them to leave a review or let them know you’re always available to help their friends and family."]]},{"id":"B21","part":"B","t":"Using your systems to your best advantage","note":"The manuscript lists Mercury, Quickli, Adobe, CitoPlus. Belinda has not written this section yet.","b":[]},{"id":"B22","part":"B","t":"Setting up templates","note":"Belinda has not written this section yet.","b":[]}]};
const PROGRAM_30={
 title:'The First 30 Days',
 sub:'The onboarding meeting and your first four weeks, mapped end to end',
 strap:'WEEK 0 → WEEK 4 · THE FYI METHOD',
 intro:'This program covers the onboarding meeting and the four weeks that follow it. Onboarding sets the relationship, the rules, and the standards. The four weeks then build the foundation underneath the business: the numbers, the marketing engine, the referral partners, and the operating rhythm. You run one focused meeting each week, and the mentee starts moving toward independence at around the twelve-week mark.',
 howToRun:[
  {h:'Thirty minutes, every week, same day and time.',b:'Protect the slot. Standards and accountability from the first meeting set the tone for the whole program.'},
  {h:'Open every meeting with a three-minute pipeline and deal check.',b:'Time is of the essence in broking, so anything live comes first, before the week\u2019s main topic.'},
  {h:'Rotate through the eight core areas.',b:'New deals, existing pipeline, current marketing, compliance, current performance, systems and processes, challenges and pain points, and goals. Each week leads with one primary focus. You will rarely cover all eight in half an hour, and that is by design.'},
  {h:'Everything measures back to the goals set in Week 1.',b:'If a task does not move one of those numbers, question why it is on the list.'},
  {h:'Set tasks every single week.',b:'Implementation is the whole game. Information without action changes nothing.'}
 ],
 coreAreas:['New deals','Existing pipeline','Current marketing','Compliance','Current performance','Systems and processes','Challenges and pain points','Goals'],
 glance:[
  ['00','The Onboarding Meeting','The relationship, the rules, and the system tour, ending with a clear bridge into Week 1.'],
  ['01','Goals & Mercury Nexus Analytics','The target is set and wired into the system so progress is tracked from day one.'],
  ['02','Marketing & Personal Brand','The biggest driver of the business is switched on: warm database plus a simple, credible brand.'],
  ['03','Referral Partners & the Value Pack','A pipeline that no longer depends on one finite list of contacts.'],
  ['04','Systems, Rhythm & 30-Day Review','The operating system is installed and the first thirty days of numbers are reviewed.']
 ],
 setNumbers:'The method here is fixed; the targets are not. A brand-new broker working refinances for family and friends gets a realistic, activity-based target for the first ninety days, not a revenue fantasy. Tailor every figure to the person in front of you and to what their DISC profile tells you about how they sell.',
 principles:[
  {h:'Implementation beats information.',b:'Tools and knowledge only pay when they are used. Success in this industry comes down to one word: implementation.'},
  {h:'This is a relationship business, not a finance business.',b:'Emotionally invested clients tell everyone they know. Build the human connection first and the referrals follow.'},
  {h:'Standards and accountability set the tone from week one.',b:'On time, phone away, tasks done. Hold the line kindly and the results take care of themselves.'},
  {h:'One list, one channel, one system done well beats a scattered effort spread across five.',b:'Depth first, then breadth.'},
  {h:'Make the broker different from the field of twenty-two and a half thousand.',b:'Better tools, better communication, and better follow-through are the whole edge.'}
 ],

  legend:'Blue stages are done by the broker. Green stages are done by the team or assistants.',
  lanes:[
   {n:'1',t:'Lead to submission',r:'Stages 1 – 9',stages:[
    ['1','Lead','A potential client enters the CRM through enquiry, referral, or marketing source.','broker'],
    ['2','Discovery Call Booked','A meeting is scheduled to discuss the client\u2019s loan needs and financial situation.','team'],
    ['3','Discovery Call Held','The broker gathers information about income, expenses, and property goals.','broker'],
    ['4','Get Basic Documents','The client provides essential documents such as ID, income proof, and bank statements.','team'],
