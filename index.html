 stages:[
  {id:'w0',n:'00',t:'The Onboarding Meeting',
   focus:'Establish the relationship, set the standards, tour the system, and confirm the mentee is set up correctly, so the first coaching meeting can go straight to work.',
   whereH:'How this meeting differs',
   where:'This is not the 30-minute coaching rhythm. It runs longer and covers relationship, ground rules, and a full system tour. You are setting the tone for everything that follows, so hold the standards from the first minute. Work through the eight items in order, and treat the bullets as your live prompts: let each one open the conversation it is meant to.',
   scriptH:'The eight items, in order',
   script:[
    {n:'1',t:'Welcome and introduction',p:[
     'Brief introduction both ways: tell me about you. This is your first real read on them.',
     'Share your Transformation Statement and the journey you take a mentee on.',
     'Set the tone: there are no dumb questions.']},
    {n:'2',t:'Expectations and ground rules',p:[
     'My role: educate you and hold you accountable. Your role: listen, learn, and apply.',
     'This mentoring is for you personally, not your team. I don\u2019t train, coach or mentor your staff, whatever you take from these sessions is yours to pass on.',
     'Weekly meetings for the first three months, rotating through the eight core areas: new deals, existing pipeline, current marketing, compliance, current performance, systems and processes, challenges and pain points, and goals.',
     'One meeting a week to get you set up, then two once you are busy.',
     'Phones on aeroplane mode, both of us, so nothing interrupts.',
     'Standards matter: I am on time and expect the same. Ten minutes late and we rebook.',
     'Any questions?']},
    {n:'3',t:'The FYI Tribe platform and WhatsApp',p:[
     'How to book extra meetings and calls through FYI Tribe.',
     'Day-to-day contact runs through WhatsApp, not the portal discussion.',
     'The sixty-plus videos: watch them, then bring me deal-specific questions.',
     'Darrel will email you a watchlist of eight videos in the order to watch them. The first two matter before our Week 1 session.',
     'Tasks are set in the meeting summary in shared files, and I expect them back promptly.',
     'Any questions?']},
    {n:'4',t:'Mercury systems and access',p:[
     'Have you met your partnership manager, and do you know their role?',
     {t:'Do you know who your partnership manager is?',field:'partnershipManager',placeholder:'Their name'},
     'Have they given you a Mercury tour and shown you how to get accredited?',
     'You make my team admin on Mercury, so I can see your deals and install the workflow.',
     'We walk the 20-stage workflow together. Open the workflow reference above.',
     'Any questions?']},
    {n:'5',t:'DISC profile',p:[
     'Purpose: your personality type. Once I know how you learn, I teach you accordingly.',
     'You will get an email; it takes five minutes.',
     'Confirm it is done, or set it now.',
     'Any questions?']},
    {n:'6',t:'Goal setting, preview only',p:[
     'Show the analytics page: Connective uses your goals to populate it.',
     'Talk goals at a high level today. We build the full goals sheet together in Week 1.',
     'In Week 1 you email it to goals@connective.com.au for Connective to load.',
     'Any questions?']},
    {n:'6b',t:'How long we are together',p:[
     'Let us talk about time, because there are two clocks running and it helps to know '+
       'the difference early.',
     'The first is our program, and it runs for twelve months. I know that sounds like a '+
       'long time when you are standing at the start of it. In my experience it is about '+
       'right. The first few months are mostly unlearning habits, the middle is where the '+
       'work compounds, and the back end is where you start to see it in your numbers. '+
       'Anything shorter and we would be stopping just as it gets good.',
     'The second is Connective. They require every new broker to be under mentorship for a '+
       'set number of months, and yours is on your file. I will tell you what it is today so '+
       'you have it from the start.',
     'They are two different things and they do not always finish together. You might complete '+
       'the Connective period with program still to run, or the other way round. Neither is a '+
       'problem, it just means we keep an eye on both.',
     'The main thing is that neither of us is ever guessing. We monitor both these dates, and '+
       'any time you want to know where you are against them, just ask.',
     'Anything you want to ask about that?']},

    {n:'7',t:'How we will work through your applications',p:[
     'While you are under supervision, I look at every application twice rather than once. '+
       'That is deliberate, and it is worth explaining why, because it will save you a lot '+
       'of frustration.',
     'The first look is before anything goes to a lender. Send it to me once the file is '+
       'built and the compliance work is done, so your best interest duty objectives are '+
       'written, the requirements are captured, and the exit strategy is documented. '+
       'This is the stage where a small thing is still a small thing. Catching it here '+
       'takes five minutes; catching it after submission can cost you a week and some '+
       'credibility with the lender.',
     'The second look is when you are packaged and ready to apply online. That is the last '+
       'set of eyes before it leaves you, and it is usually quick, because by then the hard '+
       'thinking is already done.',
     'One thing that will help us both. It is tempting to send a file early to keep things '+
       'moving, but a half-built file at the first review means I am guessing at what you '+
       'meant, and you end up doing the work twice. Send it when it is genuinely ready and '+
       'we will both go faster.',
     'Connective sets the number at twelve supervised applications. We track every one on '+
       'your file, so you will always know exactly where you are without having to count '+
       'them up yourself. You will be surprised how quickly they go by.',
     'Anything you want to ask about that?']},
    {n:'8',t:'Summary and recap',p:[
     'The monthly feedback form: three minutes, and it helps me sharpen the program while giving you a say.',
     'Confirm next steps, and the bridge into Week 1.',
     'Any questions?']}
   ],
   bridgeH:'Onboarding into Week 1',
   bridgeNote:'The onboarding meeting only pays off if it hands over cleanly. Close every onboarding by locking these down, so the mentee arrives at Week 1 already set up and knowing what is coming.',
   bridge:[
    {h:'In our next meeting · Week 1',items:[
     'We set your goals and break them across the three swim lanes.',
     'We complete the goals sheet together, and you email it to goals@connective.com.au for Connective to load into Mercury Nexus analytics.',
     'We turn that into a written 90-day activity target you can hold yourself to.',
     'We confirm the 20-stage workflow is installed in your Mercury.']}
   ],
   mentee:['Complete the DISC profile if it is not already done',
     'Confirm your partnership manager has done the Mercury tour and your accreditations are transferring',
     'Make the FYI team admin on Mercury, following the instructions Darrel will send',
     'Start the warm contact list: family, friends, past colleagues, and prior-industry contacts',
     'Bring rough numbers to Week 1: an income target and the hours per week available',
     'Save the WhatsApp group to your phone and watch the goal-setting and analytics videos'],
   mentor:['Send the starter video watchlist, via Darrel',
     'Send the DISC profile and a short explanation, via Darrel',
     'Send the Mercury admin-access instructions, via Darrel',
     'Book the next eight weeks of meetings, via Darrel',
     'Brand the first tool ready to hand over in Week 2'],

  {id:'w1',n:'01',t:'Goals & Mercury Nexus Analytics',
   focus:'Set the numbers everything else measures against, and load them into Mercury Nexus analytics through Connective so progress is tracked from the first deal.',
   whereH:'Where this sits',
   where:'You cannot manage what you do not measure. Before any marketing or partner work, the mentee needs a clear target and a system that tracks it. Goals go to Connective, Connective loads them into the analytics, and as deals settle the patterns start to show which of the three swim lanes is strong and which one needs coaching. Set the expectation now: the pattern data is a payoff for later weeks, so this week the job is simply to set the target and switch on the tracking.',
   prepMentor:'Confirm admin access has been granted on Mercury so the 20-stage workflow can be installed. Review the DISC profile; it tells you how to teach this person and which swim lane is the likely weak point. Have the goals sheet ready to complete live.',
   prepMentee:'Bring rough numbers: an income target, the hours per week available for the business, and a first pass at the warm contact list of family, friends and past colleagues.',
   agenda:[
    ['0 – 3 min','Pipeline and deal check. Anything live, anything blocked. Clear it first.'],
    ['3 – 8 min','Set the headline goal. Work backwards from the desired income: gross commission, settlement volume, number of settled loans, applications, then discovery calls. Use a sensible average loan size and conversion rate.'],
    ['8 – 18 min','Break the goal across the three swim lanes so the analytics can track it: lead to submission, submission to approval, approval to settlement. Confirm the goals-sheet fields: settlement target, application target, conversion, average loan size, and run-off assumption.'],
    ['18 – 25 min','Complete the goals sheet together and confirm the mentee will email it to goals@connective.com.au for loading into Mercury Nexus.'],
    ['25 – 30 min','Confirm the 20-stage workflow install status, set the tasks below, and recap the single most important action for the week.']
   ],
   mentee:['Grant or confirm admin access if not already done, following the instructions from Darrel',
     'Email the completed goals sheet to goals@connective.com.au so Connective can load it into the analytics',
     'Build the warm database into one simple sheet: family, friends, past colleagues, and any real estate or finance contacts',
     'Watch the goal-setting and analytics videos in the FYI Tribe learning library'],
   mentor:['Confirm the mentee has emailed the goals sheet to goals@connective.com.au',
     'Install the 20 statuses in Mercury once admin access is confirmed',
     'Record a short Loom on any specific question that came up and add it to the library'],
   done:'The goals sheet is complete and emailed to Connective, the target is loaded into analytics, the 20-stage workflow is installed or scheduled, and the mentee holds a written 90-day activity target they can repeat back to you.'},

  {id:'w2',n:'02',t:'Marketing & Personal Brand',
   focus:'Switch on the single biggest driver of the business by activating the warm database and building a simple, credible personal brand, because this is a relationship business.',
   whereH:'Where this sits',
   where:'Marketing is roughly eighty percent of the business. With goals set, this week drives the activity that feeds them. For a new broker the fastest and cheapest pipeline is the warm database, paired with a clean personal brand and real social proof. Keep the website simple: a video, social proof, a booking link, done. Do not let the mentee pour weeks into a beautiful website that almost nobody reads.',
   prepMentor:'Review the mentee\u2019s current website and social profiles, and flag anything over-built. Have the Purchase Range Reckoner ready, branded in their colours and logo, to hand over.',
   prepMentee:'Bring the warm database list from Week 1 and links to current social profiles. Note any credibility from a prior career that could serve as early social proof.',
   agenda:[
    ['0 – 3 min','Pipeline and deal check.'],
    ['3 – 10 min','The personal brand. Position around the person, not the company name. The structure that works: a short video, real social proof, a booking link. Identify what social proof this person can show right now, including credibility carried over from any previous career.'],
    ['10 – 18 min','Warm database activation. The refinance play for family and friends in the first ninety days. Segment the list and pick the first tier to contact. Hand over the outreach script and adapt it to their voice.'],
    ['18 – 25 min','Content rhythm. One channel done well beats five done badly, and LinkedIn is the FYI default. Set a simple, repeatable posting cadence and a habit of repurposing one idea into several posts.'],
    ['25 – 30 min','Set the tasks below and recap.']
   ],
   scriptBox:{
    h:'Warm reactivation message · template to adapt per contact',
    body:'Hi [Name], quick one. As you probably already know, I\u2019ve moved into mortgage broking, and I\u2019ve been helping people close to me take a proper look at their home loan before rates shift again. There\u2019s nothing you need to do today. It might just be worth knowing where you actually stand. And whenever you\u2019re ready to see how much you could be saving, I\u2019ll make the whole thing simple for you.',
    note:'The wording uses pacing and gentle presupposition, so the reader feels no pressure while a clear next step is planted. Teach the pattern, not the exact words, so every broker still sounds like themselves.'
   },
   mentee:['Contact the first tier of the warm database, around ten people, using the adapted script',
     'Set the personal brand basics: profile photo, a clear headline, and a plan to collect social proof',
     'Post once on the chosen channel before the next meeting'],
   mentor:['Deliver the Purchase Range Reckoner, branded in the mentee\u2019s colours and logo',
     'Provide the outreach script template in writing',
     'Note who the mentee finds hardest to contact; that resistance is worth coaching'],
   done:'The first warm outreach batch is sent, the personal brand basics are live, one piece of content is posted, and the branded reckoner is in the mentee\u2019s hands.'},

  {id:'w3',n:'03',t:'Referral Partners & the Partner Value Pack',
   focus:'Build the first referral partner relationships and put the Partner Value Pack to work, so the pipeline stops depending on one finite list of contacts.',
   whereH:'Where this sits',
   where:'The warm database runs out. Referral partners are the engine of a pipeline that lasts and scales. The differentiator is simple: most of the field of twenty-two and a half thousand brokers ask partners for scraps, while the FYI broker shows up with a value pack that makes the partner look good to their own clients. Prior careers are a warm way in: accountants, financial advisers, buyers agents, real estate contacts, and conveyancers. Temper expectations, because this week plants these relationships and the harvest comes later.',
   prepMentor:'Have the Partner Value Pack ready to brand, and prepare the differentiation angle for this specific mentee based on their background and network.',
   prepMentee:'List potential partner types and any existing contact inside each one. Prior colleagues and industry relationships count, and often convert fastest.',
   agenda:[
    ['0 – 3 min','Pipeline and deal check.'],
    ['3 – 9 min','Who are the right partners. Quality over quantity. Map existing warm contacts first, since a lukewarm introduction beats a cold approach every time.'],
    ['9 – 16 min','The value-first approach. What you give before you ask. How the Partner Value Pack works: the partner shares a link, the client fills in a few details, and it comes straight back to the broker. Position the broker as the professional who makes the partner look good.'],
    ['16 – 24 min','The approach conversation. How to open a partner relationship without sounding needy. Pick two or three partners to approach this week and rehearse the opening line.'],
    ['24 – 30 min','Set the tasks below and recap.']
   ],
   mentee:['Approach two or three target partners with the value-first pitch and the Partner Value Pack link',
     'Reconnect with prior-career contacts as potential partners',
     'Log every partner conversation in the pipeline notes'],
   mentor:['Brand and send the Partner Value Pack',
     'Provide the partner approach script',
     'Flag any partner type that suits this mentee\u2019s background especially well'],
   done:'Two or three partner conversations are open, the Partner Value Pack is live and branded, and a target partner list is documented for the weeks ahead.'},

  {id:'w4',n:'04',t:'Systems, Rhythm & 30-Day Review',
   focus:'Embed the operating rhythm, review the first deals through the swim lanes, and check goals against actuals before the mentee moves toward independence.',
   whereH:'Where this sits',
   where:'By Week 4 there should be live activity. Now you install the discipline that keeps deals moving, read what the analytics are starting to show, and shore up the weak swim lane, which for a natural hunter is usually the admin-heavy middle lane. This becomes the operating system for the rest of the program and beyond.',
   prepMentor:'Pull the mentee\u2019s Kanban and analytics and note the early patterns. Decide in advance which swim lane you expect to be the weak point, then test it against the data.',
   prepMentee:'Have every live deal staged correctly in the 20-stage Kanban, so the review is quick and honest.',
   agenda:[
    ['0 – 3 min','Pipeline and deal check.'],
    ['3 – 10 min','Kanban discipline. The 20 stages; green is the team, blue is the broker. Install the weekly pipeline review habit: every deal, every stage, every week, in the spirit of the old Tuesday NINJA meeting.'],
    ['10 – 18 min','The 30-day review. Goals against actuals in the analytics. Which swim lane is lagging, and why. Keep it factual, not emotional.'],
    ['18 – 25 min','Shore up the weak lane. Put a system or process around the stage where deals stall, so the time to getting paid shortens.'],
    ['25 – 30 min','Set the cadence for weeks 5 to 8, remind the mentee about the monthly feedback form, and recap.']
   ],
   mentee:['Run one self-led pipeline review before the next meeting',
     'Confirm every live deal is correctly staged in the Kanban',
     'Complete the monthly feedback form if it is due'],
   mentor:['Review the analytics and set the coaching focus for weeks 5 to 8',
     'Confirm the next eight-week booking block with Darrel',
     'Decide whether the elite CRM bolt-on is worth raising yet'],
   done:'All deals are staged, the first 30-day review is complete, the weak swim lane has a fix in place, and weeks 5 to 8 are booked.'}
 ]
};

/* Netlify Identity puts the invite/confirmation token in the URL fragment
   when someone clicks the link in their invite email, not anywhere the
   old manual-paste flow could see without being told. This reads it
   straight off the address bar, drops it into the accept screen, and
   scrubs it from the visible URL and history so it doesn't linger there
   after the password is set. */
(function initFromInviteLink(){
  const hash = location.hash || '';
  const m = hash.match(/invite_token=([^&]+)/) || hash.match(/confirmation_token=([^&]+)/);
  if(m){
    showAccept();
    document.getElementById('acToken').value = decodeURIComponent(m[1]);
    history.replaceState(null, '', location.pathname);
  }
})();

boot();
