<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FYI Coaches' Corner v1.09.05</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --radius:10px; }
/* Theme palettes, taken directly from The Bridge, one per tab, so Coaches'
   Corner reads as the same product rather than a lookalike. The body's
   theme class switches with the active tab, same mechanism The Bridge
   uses per business. */
body.theme-clients{ --bg:#F4F6F9;--card:#FFF;--primary:#2A3550;--accent:#4A6FA5;--accent2:#C59C44;--text:#26293A;--muted:#69707F;--border:#DFE3EB; }
body.theme-prospects{ --bg:#F7F5F9;--card:#FFF;--primary:#3B2F4A;--accent:#7A5C93;--accent2:#C59C44;--text:#312A3A;--muted:#6F6678;--border:#E5DFEA; }
body.theme-rel{ --bg:#F4F7F6;--card:#FFF;--primary:#24413C;--accent:#3E8E7E;--accent2:#C59C44;--text:#22322E;--muted:#657771;--border:#DCE7E3; }
body.theme-sop{ --bg:#F7F5F2;--card:#FFF;--primary:#3B3730;--accent:#8A6D3F;--accent2:#6090C9;--text:#332F29;--muted:#726B60;--border:#E6E0D6; }
body.theme-training{ --bg:#F5F3F8;--card:#FFF;--primary:#3A3252;--accent:#6B5B95;--accent2:#C59C44;--text:#2E2940;--muted:#6E6880;--border:#E4DFEC; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg,#F4F6F9);color:var(--text,#26293A);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;transition:background .25s ease}
h1,h2,h3,.brand,nav button,.section-title{font-family:'Montserrat',sans-serif}
.hidden{display:none !important}
/* ---- Login ---- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1D4D71}
.loginBox{background:#fff;border-radius:12px;padding:36px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.loginBox h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;margin:0 0 4px;color:#2A3550}
.loginBox p.sub{color:#69707F;font-size:13px;margin:0 0 20px}
.loginBox input{width:100%;padding:10px 12px;border:1px solid #DFE3EB;border-radius:8px;margin-bottom:10px;font-size:14px;font-family:'Inter',sans-serif}
.loginBox button{width:100%;padding:11px;border:0;border-radius:8px;background:#4A6FA5;color:#fff;font-size:14px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer}
.loginBox button:hover{filter:brightness(.94)}
.loginErr{color:#B23A33;font-size:13px;margin:8px 0 0;min-height:16px}
.loginLinks{margin-top:14px;font-size:12px;color:#69707F;text-align:center}
.loginLinks a{color:#4A6FA5;cursor:pointer;text-decoration:none;font-weight:600}
/* ---- App shell ---- */
#app{display:none}
#app.show{display:block}
header.top{background:#1D4D71;color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
header.top .brand{font-weight:800;font-size:17px}
header.top .verBadge{font-family:'Inter',sans-serif;font-size:.62rem;font-weight:600;color:#D9E7F0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:2px 8px;border-radius:99px;margin-left:8px;cursor:pointer;vertical-align:middle}
header.top .verBadge:hover{background:rgba(255,255,255,.2)}
header.top .brand small{font-weight:500;font-family:'Inter',sans-serif;color:#AFC9DC;margin-left:8px;font-size:12px}
header.top .who{font-size:13px;color:#D9E7F0;display:flex;align-items:center;gap:12px}
header.top .who button{background:transparent;border:1px solid #3E7098;color:#D9E7F0;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif}
nav{display:flex;gap:7px;background:var(--card,#fff);border-bottom:1px solid var(--border,#DFE3EB);padding:12px 22px;overflow-x:auto;flex-wrap:wrap}
nav button{padding:8px 15px;border-radius:999px;border:1.5px solid var(--border,#DFE3EB);background:var(--bg,#F4F6F9);color:var(--muted,#69707F);cursor:pointer;font-size:.8rem;font-weight:600;white-space:nowrap;transition:all .15s ease}
nav button:hover{border-color:var(--accent,#4A6FA5);color:var(--primary,#2A3550)}
nav button.active{background:var(--primary,#2A3550);border-color:var(--primary,#2A3550);color:#fff}
main{padding:22px;max-width:1140px;margin:0 auto}
.banner{background:#FBF3E2;border:1px solid #E0B45C;color:#8A671B;padding:10px 14px;border-radius:9px;font-size:13px;margin-bottom:16px}
.banner.err{background:#FBEBEA;border-color:#D98782;color:#A8382F}
.banner.ok{background:#EFF7EF;border-color:#7BAE7F;color:#3E7C43}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.toolbar input[type=search]{padding:8px 12px;border:1px solid var(--border,#DFE3EB);border-radius:8px;font-size:13px;min-width:220px;font-family:'Inter',sans-serif;background:var(--card,#fff)}
.cl-filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.cl-filter{padding:6px 12px;border-radius:999px;border:1.5px solid var(--border,#DFE3EB);background:var(--bg,#F4F6F9);color:var(--muted,#69707F);font-size:.75rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.cl-filter:hover{border-color:var(--accent,#4A6FA5);color:var(--primary,#2A3550)}
.cl-filter.active{background:var(--primary,#2A3550);border-color:var(--primary,#2A3550);color:#fff}
.btn{padding:7px 13px;border:0;border-radius:7px;background:var(--accent,#4A6FA5);color:#fff;font-size:.78rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.btn:hover{filter:brightness(.94)}
.btn.secondary{background:transparent;color:var(--primary,#2A3550);border:1px solid var(--accent,#4A6FA5)}
.btn.ghost{background:transparent;color:var(--muted,#69707F);border:1px solid var(--border,#DFE3EB)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.card{background:var(--bg,#F4F6F9);border:1px solid var(--border,#DFE3EB);border-radius:var(--radius);padding:13px 14px;border-left:4px solid var(--border,#DFE3EB);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.07)}
.card.rag-green{border-left-color:#57A05C}
.card.rag-amber{border-left-color:#E0A93C}
.card.rag-red{border-left-color:#C0453F}
.card.pr-fresh{border-left-color:#57A05C}
.card.pr-warm{border-left-color:#E0A93C}
.card.pr-stale{border-left-color:#C0453F}
.card h3{margin:0 0 4px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.94rem;color:var(--primary,#2A3550)}
.card .meta{font-size:.71rem;color:var(--muted,#69707F);display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:.63rem;font-weight:600;background:var(--card,#fff);border:1px solid var(--border,#DFE3EB);color:var(--muted,#69707F)}
.tag.green{background:#EFF7EF;border-color:#7BAE7F;color:#3E7C43}
.tag.amber{background:#FBF3E2;border-color:#E0B45C;color:#8A671B}
.tag.red{background:#FBEBEA;border-color:#D98782;color:#A8382F}
.tag.grey{background:var(--card,#fff);color:var(--muted,#69707F)}
.empty{color:var(--muted,#69707F);font-size:13px;padding:30px;text-align:center}
/* ---- Detail panel ---- */
.detail{background:var(--card,#fff);border:1px solid var(--border,#DFE3EB);border-radius:12px;padding:22px}
.detail .back{background:none;border:0;color:var(--accent,#4A6FA5);font-weight:700;cursor:pointer;font-size:.8rem;margin-bottom:14px;padding:0;font-family:'Inter',sans-serif}
.detail h2{margin:0 0 16px;font-family:'Montserrat',sans-serif;font-weight:800;color:var(--primary,#2A3550)}
.fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.63rem;color:var(--muted,#69707F);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--border,#DFE3EB);border-radius:6px;font-size:13px;font-family:'Inter',sans-serif;background:var(--bg,#F4F6F9)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent,#4A6FA5);background:var(--card,#fff)}
.field textarea{grid-column:1/-1;min-height:70px;resize:vertical}
.field.full{grid-column:1/-1}
.detailActions{margin-top:18px;display:flex;gap:8px;align-items:center}
.savedNote{font-size:12px;color:var(--muted,#69707F)}
/* ---- SOPs ---- */
.sopList{display:flex;flex-direction:column;gap:6px}
.sopRow{padding:10px 12px;border:1px solid var(--border,#DFE3EB);border-radius:8px;background:var(--card,#fff);cursor:pointer;display:flex;justify-content:space-between;font-size:13px}
.sopRow:hover{border-color:var(--accent,#8A6D3F)}
.sopGroup{font-size:.66rem;text-transform:uppercase;color:var(--muted,#69707F);letter-spacing:.05em;margin:16px 0 6px;font-weight:700}
.sopDoc{background:var(--card,#fff);border:1px solid var(--border,#DFE3EB);border-radius:12px;padding:22px;line-height:1.55;font-size:14px}
.sopDoc h2{margin-top:0;font-family:'Montserrat',sans-serif;color:var(--primary,#3B3730)}
.sopDoc h4{margin:18px 0 6px;font-size:.66rem;text-transform:uppercase;color:var(--muted,#726B60);letter-spacing:.04em}
/* ---- Training ---- */
.module{background:var(--card,#fff);border:1px solid var(--border,#E4DFEC);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.module h3{margin:0 0 6px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.9rem;color:var(--primary,#3A3252)}
.module .why{color:var(--muted,#6E6880);font-size:13px;margin-bottom:10px}
.module ul.checklist{list-style:none;padding:0;margin:0}
.module ul.checklist li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px}
.module ul.checklist input{margin-top:3px;accent-color:var(--accent,#6B5B95)}
.progressBar{height:6px;background:var(--border,#E4DFEC);border-radius:3px;overflow:hidden;margin:10px 0 20px}
.progressBar .fill{height:100%;background:var(--accent,#6B5B95)}
</style>
</head>
<body class="theme-clients">

<div id="loginScreen">
  <div class="loginBox">
    <h1>FYI Coaches' Corner</h1>
    <p class="sub">Sign in with the account you were invited on.</p>
    <input id="liEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="liPass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="liBtn" onclick="doLogin()">Sign in</button>
    <div class="loginErr" id="liErr"></div>
    <div class="loginLinks"><a onclick="showAccept()">Accepting an invite? Set your password here</a></div>
  </div>
</div>

<div id="acceptScreen" class="hidden">
  <div id="loginScreen" style="display:flex">
    <div class="loginBox">
      <h1>Set your password</h1>
      <p class="sub">Paste the token from your invite email link, then choose a password.</p>
      <input id="acToken" placeholder="Invite token (from the email link)">
      <input id="acPass" type="password" placeholder="New password" autocomplete="new-password">
      <button onclick="doAccept()">Set password and sign in</button>
      <div class="loginErr" id="acErr"></div>
      <div class="loginLinks"><a onclick="showLogin()">Back to sign in</a></div>
    </div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="brand">FYI Coaches' Corner<span class="verBadge" id="verBadge" onclick="toggleChangelog()" title="Click for what's new">v1.09.05</span><small id="coachBadge"></small></div>
    <div class="who">
      <span id="whoEmail"></span>
      <button onclick="doLogout()">Sign out</button>
    </div>
  </header>
  <div id="changelogPanel" class="hidden" style="background:#fff;border-bottom:1px solid var(--border,#DFE3EB);padding:16px 22px;max-width:1140px;margin:0 auto"></div>
  <nav id="tabs">
    <button data-tab="clients" onclick="setTab('clients')">Clients</button>
    <button data-tab="prospects" onclick="setTab('prospects')">Prospects</button>
    <button data-tab="relationships" onclick="setTab('relationships')">Relationships</button>
    <button data-tab="sops" onclick="setTab('sops')">SOPs</button>
    <button data-tab="training" onclick="setTab('training')">Coach Training</button>
  </nav>
  <main id="main"></main>
</div>


<script>
/* ================= Identity (no widget) ================= */
const IDENTITY = location.origin + '/.netlify/identity';
function saveSession(s){ localStorage.setItem('cc_session', JSON.stringify(s)); }
function getSession(){ try{ return JSON.parse(localStorage.getItem('cc_session')||'null'); }catch(e){ return null; } }
function clearSession(){ localStorage.removeItem('cc_session'); }

async function doLogin(){
  const email=document.getElementById('liEmail').value.trim();
  const pass=document.getElementById('liPass').value;
  const err=document.getElementById('liErr'); err.textContent='';
  if(!email||!pass){ err.textContent='Enter your email and password.'; return; }
  try{
    const r=await fetch(IDENTITY+'/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'grant_type=password&username='+encodeURIComponent(email)+'&password='+encodeURIComponent(pass)});
    const d=await r.json();
    if(!r.ok){ err.textContent = d.error_description || 'Sign in failed. Check your email and password.'; return; }
    saveSession({access_token:d.access_token, refresh_token:d.refresh_token, email});
    boot();
  }catch(e){ err.textContent='Could not reach the sign-in service.'; }
}

function showAccept(){ document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('acceptScreen').classList.remove('hidden'); }
function showLogin(){ document.getElementById('acceptScreen').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden'); }

async function doAccept(){
  const token=document.getElementById('acToken').value.trim();
  const pass=document.getElementById('acPass').value;
  const err=document.getElementById('acErr'); err.textContent='';
  if(!token||!pass){ err.textContent='Paste the token and choose a password.'; return; }
  try{
    /* Password must be included in this single call. A separate verify-then-update
       pattern fails, and a failed token attempt burns the token, requiring a fresh
       invite. */
    const r=await fetch(IDENTITY+'/verify',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:'signup', token, password:pass})});
    const d=await r.json();
    if(!r.ok){ err.textContent = d.msg || d.error_description || 'That token was not accepted. Ask Ben to resend the invite.'; return; }
    saveSession({access_token:d.token && d.token.access_token, refresh_token:d.token && d.token.refresh_token, email:d.email});
    boot();
  }catch(e){ err.textContent='Could not reach the sign-in service.'; }
}

function doLogout(){ clearSession(); location.reload(); }

async function authedFetch(url, opts){
  const s=getSession();
  opts=opts||{}; opts.headers=Object.assign({'Authorization':'Bearer '+(s?s.access_token:''), 'Content-Type':'application/json'}, opts.headers||{});
  let r=await fetch(url,opts);
  if(r.status===401 && s && s.refresh_token){
    const rr=await fetch(IDENTITY+'/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(s.refresh_token)});
    if(rr.ok){ const d=await rr.json(); saveSession({access_token:d.access_token, refresh_token:d.refresh_token, email:s.email});
      opts.headers['Authorization']='Bearer '+d.access_token; r=await fetch(url,opts); }
  }
  return r;
}

/* ================= Versioning ================= */
/* major.month.build, month zero-padded, matching The Bridge's convention.
   Bump APP_VERSION, the <title>, the header badge, and add a RELEASES
   entry, all in the same edit, or the changelog silently falls behind
   the build the way The Bridge's own once did. */
const APP_VERSION = '1.09.05';
const RELEASES = [
  {v:'1.09.05', d:'07/09/2026', t:'Prospect detail view and editing', items:[
    'Prospects can now be opened and edited, not just created. New prospect-update.js function, same ownership check as clients: a coach can only save changes to their own prospects, verified against Airtable\u2019s current value, not the browser\u2019s copy.',
    'Detail view shows every writable field plus the Airtable-calculated ones, days in pipeline, days since activity, annual value, as read-only.',
    'Coaches cannot reassign a prospect to another coach from this app, same rule as clients.'
  ]},
  {v:'1.09.04', d:'07/09/2026', t:'Prospect cards matched to The Bridge', items:[
    'Temperature stripe added, green, amber or red by days since last contact, same thresholds as The Bridge.',
    'Pipeline days, days since contact and monthly fee now shown as stat rows, with the same warn and watch colour coding on days since contact.',
    'Overdue flag added when the expected close date has passed.',
    'Coach name shown in the sub-line, visible to Ben only, since a single coach\u2019s own view has no need to repeat it.',
    'The Bridge\u2019s editable \u201cOur notes\u201d field on each prospect card is not included, it has no Airtable column behind it. Flagged, not silently dropped.'
  ]},
  {v:'1.09.03', d:'07/09/2026', t:'Active roster filter was matching nothing', items:[
    'Fixed: the Status field actually holds Active, Left or Graduated in Airtable, never Current. The Active roster filter was checking for a value that does not exist, so it silently returned zero clients. Filters now match the real values.'
  ]},
  {v:'1.09.02', d:'07/09/2026', t:'Fireflies and client filters', items:[
    'Meeting intelligence added to the client file: last meeting summary and action items, pulled from Fireflies and matched by name, same title convention as The Bridge. Coach-scoped, a coach only ever sees entries for their own clients.',
    'Client filter chips: Active roster, Everyone, Needs attention, Immersion, Previous clients, Exit date missing. Ben also gets a filter chip per coach.',
    'Filters requiring Argo or Too Easy Socials data, or fields still pending Airtable migration (contacts confirmed, First 30 Days running), deliberately left out rather than shipped broken.'
  ]},
  {v:'1.09.01', d:'07/09/2026', t:'First versioned build', items:[
    'Coaches\u2019 Corner split out of The Bridge: Clients, Prospects and Relationships, view and edit, scoped so a coach only ever sees their own.',
    'SOPs and Coach Training duplicated as reference content.',
    'DISC profile chart and the First 30 Days program script added to every client file, First 30 Days as reference only, per-client progress not yet tracked here.',
    'Visual design matched to The Bridge, per-tab theming, Inter and Montserrat, the same card and pill styling.'
  ]}
];

function toggleChangelog(){
  const p=document.getElementById('changelogPanel');
  if(!p.classList.contains('hidden')){ p.classList.add('hidden'); return; }
  let html='<div style="max-width:640px"><h3 style="margin:0 0 10px;font-family:Montserrat,sans-serif">What\'s new</h3>';
  RELEASES.forEach(r=>{
    html+='<div style="margin-bottom:14px"><b>v'+r.v+'</b> <span style="color:var(--muted,#69707F);font-size:.78rem">'+r.d+', '+r.t+'</span>'+
      '<ul style="margin:6px 0 0;padding-left:18px;font-size:13px">'+r.items.map(x=>'<li style="margin-bottom:3px">'+x+'</li>').join('')+'</ul></div>';
  });
  html+='</div>';
  p.innerHTML=html;
  p.classList.remove('hidden');
}


/* ================= State ================= */
const STATE = { coach:null, principal:false, clients:[], prospects:[], relationships:[], tab:'clients',
  clientOpen:null, prospectOpen:null, relOpen:null, sopOpen:null, trainProgress:{} };

async function boot(){
  const s=getSession();
  if(!s){ return; }
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('acceptScreen').classList.add('hidden');
  document.getElementById('app').classList.add('show');
  document.getElementById('whoEmail').textContent = s.email || '';
  await loadRoster();
  await loadTraining();
  loadFireflies().then(()=>{ if(STATE.tab==='clients') render(); }); /* not awaited: never block first paint on a third-party API */
  setTab('clients');
}

function banner(msg, kind){
  const m=document.getElementById('main');
  const b=document.createElement('div');
  b.className='banner'+(kind?(' '+kind):'');
  b.textContent=msg;
  m.prepend(b);
  if(kind!=='err') setTimeout(()=>b.remove(), 5000);
}

async function loadRoster(){
  try{
    const r=await authedFetch('/.netlify/functions/sync-roster',{method:'POST'});
    const d=await r.json();
    if(!r.ok || !d.ok){ document.getElementById('main').innerHTML='<div class="banner err">'+(d.message||d.why||'Could not load your roster. Reload, or tell Ben if it keeps happening.')+'</div>'; return; }
    STATE.coach=d.coach; STATE.principal=d.principal;
    STATE.clients=d.clients||[]; STATE.prospects=d.prospects||[]; STATE.relationships=d.relationships||[];
    document.getElementById('coachBadge').textContent = STATE.principal ? 'all coaches' : STATE.coach;
  }catch(e){ document.getElementById('main').innerHTML='<div class="banner err">Could not reach the server. Check your connection and reload.</div>'; }
}

async function loadFireflies(){
  try{
    const r=await authedFetch('/.netlify/functions/fireflies',{method:'POST'});
    const d=await r.json();
    STATE.fireflies = (d.ok && d.byClient) ? d.byClient : {};
  }catch(e){ STATE.fireflies = {}; }
}

async function loadTraining(){
  try{
    const r=await authedFetch('/.netlify/functions/state',{method:'GET'});
    const d=await r.json();
    STATE.trainProgress = d.value ? JSON.parse(d.value) : {};
  }catch(e){ STATE.trainProgress = {}; }
}
async function saveTraining(){
  try{ await authedFetch('/.netlify/functions/state',{method:'POST', body: JSON.stringify({value: JSON.stringify(STATE.trainProgress)})}); }
  catch(e){ banner('Progress could not be saved. Try again.', 'err'); }
}

function setTab(t){
  STATE.tab=t; STATE.clientOpen=null; STATE.prospectOpen=null; STATE.relOpen=null; STATE.sopOpen=null;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  /* Same mechanism The Bridge uses per business: the active tab decides
     the palette, so Coaches' Corner shifts tone the same way rather than
     staying one flat colour throughout. */
  const THEME_CLASS = { clients:'theme-clients', prospects:'theme-prospects', relationships:'theme-rel', sops:'theme-sop', training:'theme-training' };
  document.body.className = THEME_CLASS[t] || 'theme-clients';
  render();
}
function render(){
  const fn = { clients:renderClients, prospects:renderProspects, relationships:renderRelationships,
    sops:renderSOPs, training:renderTraining }[STATE.tab];

const CLIENT_FILTERS = [
  {id:'active', label:'Active roster', test:c => c.clientStatus==='Active'},
  {id:'everyone', label:'Everyone', test:()=>true},
  {id:'attention', label:'Needs attention', test:c => c.clientStatus==='Active' && (c.rag==='Amber'||c.rag==='Red')},
  {id:'immersion', label:'Immersion', test:c => c.st==='1. Immersion'},
  {id:'previous', label:'Previous clients', test:c => c.clientStatus==='Left' || c.clientStatus==='Graduated'},
  {id:'exitmissing', label:'Exit date missing', test:c => (c.clientStatus==='Left' || c.clientStatus==='Graduated') && !c.exitDate}
];

function ragTag(v){
  const k=(v||'').toLowerCase();
  if(k==='green') return '<span class="tag green">Green</span>';
  if(k==='amber') return '<span class="tag amber">Amber</span>';
  if(k==='red') return '<span class="tag red">Red</span>';
  return v ? '<span class="tag grey">'+v+'</span>' : '';
}
function ragClass(v){
  const k=(v||'').toLowerCase();
  return (k==='green'||k==='amber'||k==='red') ? ' rag-'+k : '';
}

function renderClients(){
  const m=document.getElementById('main');
  if(STATE.clientOpen) return renderClientDetail();
  if(!STATE.clientFilter) STATE.clientFilter='active';
  const q=(document.getElementById('cQ')?document.getElementById('cQ').value:'').toLowerCase();

  const bar=document.createElement('div'); bar.className='toolbar';
  bar.innerHTML='<input type="search" id="cQ" placeholder="Search clients" oninput="render()" value="'+(q?q:'')+'">'+
    '<button class="btn" onclick="openNewClient()">New client</button>';
  m.appendChild(bar);

  /* Filter chips. Coach chips only appear for Ben, since a coach's own
     view is already scoped to just their name, a filter for it would be
     a no-op. Options that would need Argo or Too Easy Socials data, or
     the Airtable fields still pending migration (contacts confirmed,
     First 30 Days running), are left out rather than shown and left
     broken. */
  const chipRow=document.createElement('div'); chipRow.className='cl-filters';
  CLIENT_FILTERS.forEach(f=>{
    const b=document.createElement('button'); b.className='cl-filter'+(STATE.clientFilter===f.id?' active':'');
    b.textContent=f.label; b.onclick=()=>{ STATE.clientFilter=f.id; render(); };
    chipRow.appendChild(b);
  });
  if(STATE.principal){
    const coaches=[...new Set(STATE.clients.map(c=>c.c).filter(Boolean))].sort();
    coaches.forEach(name=>{
      const id='coach:'+name;
      const b=document.createElement('button'); b.className='cl-filter'+(STATE.clientFilter===id?' active':'');
      b.textContent=name+"'s"; b.onclick=()=>{ STATE.clientFilter=id; render(); };
      chipRow.appendChild(b);
    });
  }
  m.appendChild(chipRow);

  const activeFilter = CLIENT_FILTERS.find(f=>f.id===STATE.clientFilter);
  const coachFilterName = (!activeFilter && STATE.clientFilter && STATE.clientFilter.indexOf('coach:')===0) ? STATE.clientFilter.slice(6) : null;
  let list = STATE.clients.filter(c=>{
    if(activeFilter) return activeFilter.test(c);
    if(coachFilterName) return c.c===coachFilterName;
    return true;
  });
  list = list.filter(c=>!q || c.n.toLowerCase().includes(q));

  const countLine=document.createElement('div'); countLine.style.cssText='font-size:.78rem;color:var(--muted,#69707F);margin:2px 0 12px';
  countLine.textContent=list.length+' client'+(list.length===1?'':'s');
  m.appendChild(countLine);

  if(!list.length){ m.innerHTML+='<div class="empty">No clients found.</div>'; return; }
  const grid=document.createElement('div'); grid.className='grid';
  list.forEach(c=>{
    const card=document.createElement('div'); card.className='card'+ragClass(c.rag);
    card.onclick=()=>{ STATE.clientOpen=c.airtableId; render(); };
    card.innerHTML='<h3>'+c.n+'</h3>'+
      '<div class="meta">'+ragTag(c.rag)+'<span class="tag grey">'+(c.p||'No program')+'</span>'+
      (STATE.principal?'<span class="tag grey">'+(c.c||'Unassigned')+'</span>':'')+'</div>'+
      '<div class="meta">'+(c.st||'')+(c.f?' &middot; $'+Number(c.f).toLocaleString()+'/mo':'')+'</div>';
    grid.appendChild(card);
  });
  m.appendChild(grid);
}

function fieldRow(label, id, value, type){
  type=type||'text';
  if(type==='textarea') return '<div class="field full"><label>'+label+'</label><textarea id="'+id+'">'+(value||'')+'</textarea></div>';
  return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+(value==null?'':String(value).replace(/"/g,'&quot;'))+'"></div>';
}

/* ================= DISC ================= */
function discPanel(animal){
  const a=ANIMALS[animal]; if(!a) return document.createElement('div');
  const lv=discLevels(animal);
  const hi=lv.slice().sort((x,y)=>y.v-x.v)[0];
  const lo=lv.slice().sort((x,y)=>x.v-y.v)[0];
  const wrap=document.createElement('div'); wrap.className='detail'; wrap.style.marginTop='14px';
  let bars='<div style="display:flex;gap:18px;align-items:flex-end;height:120px;margin:14px 0">';
  lv.forEach(b=>{
    const h=(b.v/4*100);
    const color = b.v===4 ? 'var(--accent,#4A6FA5)' : b.v===1 ? 'var(--border,#DFE3EB)' : '#C59C44';
    bars+='<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1">'+
      '<div style="width:100%;max-width:44px;height:'+h+'%;background:'+color+';border-radius:6px 6px 0 0;align-self:flex-end"></div>'+
      '<b style="font-family:Montserrat,sans-serif">'+b.l+'</b><span style="font-size:.68rem;color:var(--muted,#69707F)">'+DISC_LEVELS[b.v]+'</span>'+
    '</div>';
  });
  bars+='</div>';
  wrap.innerHTML='<h2>DISC profile, '+animal+' ('+a.p+' '+a.n+')</h2>'+bars+
    '<div class="fieldGrid" style="margin-top:6px">'+
      '<div class="field"><label>Highest</label><div>'+hi.l+', '+TRAIT[hi.l]+'</div></div>'+
      '<div class="field"><label>Lowest</label><div>'+lo.l+', '+TRAIT[lo.l]+'</div></div>'+
      '<div class="field"><label>Suits</label><div>'+a.role+'</div></div>'+
      '<div class="field"><label>Pace</label><div>'+a.pace+'</div></div>'+
      '<div class="field full"><label>Coaching them</label><div>'+COACH[hi.l]+'</div></div>'+
    '</div>';
  return wrap;
}

/* ================= First 30 Days, reference only =================
   The program script is static, transcribed from The Bridge, and safe to
   duplicate. Whether THIS client is running it, which tasks are ticked,
   and the onboarding meeting date are per-client facts that only exist
   in The Bridge's own local state right now, not in Airtable, so they
   can't be shown or edited here yet. That migration is tracked
   separately, not skipped. */
function renderP30Reference(){
  let html='<h2>'+PROGRAM_30.title+'</h2><p style="color:var(--muted,#69707F);font-size:13px">'+PROGRAM_30.sub+'</p>'+
    '<div class="banner" style="margin:14px 0">Per-client progress on this program, the onboarding date and task sign-off, isn\'t tracked here yet. It still needs its own Airtable columns. This is the reference script only.</div>'+
    '<div class="grid" style="margin-top:10px">';
  PROGRAM_30.glance.forEach(g=>{
    html+='<div class="card" style="cursor:default"><h3>'+g[0]+', '+g[1]+'</h3><div class="meta" style="margin-top:6px">'+g[2]+'</div></div>';
  });
  html+='</div>';
  return html;

async function pushClient(id){
  const c=STATE.clients.find(x=>x.airtableId===id);
  const fields={
    clientStatus: document.getElementById('fClientStatus').value,
    p: document.getElementById('fP').value,
    st: document.getElementById('fSt').value,

    f: document.getElementById('fF').value,
    s: document.getElementById('fS').value,

    disc: document.getElementById('fDisc').value,
    phone: document.getElementById('fPhone').value,
    dob: document.getElementById('fDob').value,
    startDate: document.getElementById('fStartDate').value,
    exitDate: document.getElementById('fExitDate').value,
    mandatedMonths: document.getElementById('fMandatedMonths').value,
    notes: document.getElementById('fNotes').value
  };
  const note=document.getElementById('clientSaveNote'); note.textContent='Saving...';
  try{
    const r=await authedFetch('/.netlify/functions/client-update',{method:'POST', body:JSON.stringify({recordId:id, name:c.n, fields})});

function prOverdue(p){ return p.close && p.close < new Date().toISOString().slice(0,10); }

          '<div style="font-family:Montserrat,sans-serif;font-weight:700;font-size:1rem;color:'+(idleCls==='warn'?'#B23A33':idleCls==='watch'?'#8A671B':'var(--primary,#3B2F4A)')+'">'+(p.idle||0)+'d</div></div>'+

  SOPS.filter(s=>!q || s.n.toLowerCase().includes(q) || (s.g||'').toLowerCase().includes(q)).forEach(s=>{
    (groups[s.g]=groups[s.g]||[]).push(s);
  });
  const wrap=document.createElement('div');
  Object.entries(groups).forEach(([g,items])=>{
    wrap.innerHTML+='<div class="sopGroup">'+g+'</div>';
    const list=document.createElement('div'); list.className='sopList';
    items.forEach(s=>{
      const row=document.createElement('div'); row.className='sopRow';
      row.onclick=()=>{ STATE.sopOpen=s.id; render(); };
      row.innerHTML='<span>'+s.n+'</span><span>&rarr;</span>';
      list.appendChild(row);
    });
    wrap.appendChild(list);
  });
  m.appendChild(wrap);
}
function renderSopDoc(){
  const m=document.getElementById('main');
  const s=SOPS.find(x=>x.id===STATE.sopOpen);
  if(!s){ STATE.sopOpen=null; return renderSOPs(); }
  const d=document.createElement('div'); d.className='detail';
  let body='<button class="back" onclick="STATE.sopOpen=null; render()">&larr; Back to SOPs</button>';
  body+='<div class="sopDoc"><h2>'+s.n+'</h2>';
  if(s.purpose) body+='<h4>Purpose</h4><p>'+s.purpose+'</p>';
  if(s.scope) body+='<h4>Scope</h4><p>'+s.scope+'</p>';
  if(Array.isArray(s.inputs) && s.inputs.length){ body+='<h4>What you need</h4><ul>'+s.inputs.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  if(Array.isArray(s.steps) && s.steps.length){
    body+='<h4>Steps</h4><ol>';
    s.steps.forEach(step=>{
      body+='<li><b>'+step.t+'</b>';
      if(Array.isArray(step.b) && step.b.length) body+='<ul>'+step.b.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
      body+='</li>';
    });
    body+='</ol>';
  }
  if(Array.isArray(s.check) && s.check.length){ body+='<h4>Signed off when</h4><ul>'+s.check.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  if(Array.isArray(s.notes) && s.notes.length){ body+='<h4>Notes</h4><ul>'+s.notes.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  body+='</div>';
  d.innerHTML=body;
  m.appendChild(d);
}

/* ================= Coach Training ================= */
function renderTraining(){
  const m=document.getElementById('main');
  const mine = STATE.trainProgress || {};
  const totalChecks = TRAIN_MODULES.reduce((a,mod)=>a+mod.check.length,0);
  let done=0;
  TRAIN_MODULES.forEach(mod=>{ (mine[mod.id]||[]).forEach(v=>{ if(v) done++; }); });
  const pct = totalChecks ? Math.round(done/totalChecks*100) : 0;

  const head=document.createElement('div');
  head.innerHTML='<p style="color:var(--muted);font-size:13px">'+done+' of '+totalChecks+' items signed off, '+pct+'%.</p>'+
    '<div class="progressBar"><div class="fill" style="width:'+pct+'%"></div></div>';
  m.appendChild(head);

  TRAIN_MODULES.forEach(mod=>{
    const box=document.createElement('div'); box.className='module';
    let html='<h3>'+mod.t+'</h3><div class="why">'+mod.why+'</div>';
    if(Array.isArray(mod.res) && mod.res.length){
      const links = mod.res.filter(x=>x.k==='drive'||x.k==='read');
      if(links.length){
        html+='<div style="font-size:12px;color:var(--muted);margin-bottom:10px">'+
          links.map(x=> x.k==='drive' ? '<a href="'+x.u+'" target="_blank" style="color:var(--teal-dk)">'+x.t+'</a>' : x.t ).join(' &middot; ')+
        '</div>';
      }
    }
    html+='<ul class="checklist">';
    mod.check.forEach((label,i)=>{
      const checked = (mine[mod.id] && mine[mod.id][i]) ? 'checked' : '';
      html+='<li><input type="checkbox" '+checked+' onchange="toggleCheck(\''+mod.id+'\','+i+',this.checked)"> <span>'+label+'</span></li>';
    });
    html+='</ul>';
    box.innerHTML=html;
    m.appendChild(box);
  });
}
function toggleCheck(modId, idx, val){
  STATE.trainProgress[modId] = STATE.trainProgress[modId] || [];
  STATE.trainProgress[modId][idx] = val;
  saveTraining();
}

const DISC_LETTERS=['D','I','S','C'];
const DISC_LEVELS={4:'Very high',3:'High',2:'Low',1:'Very low'};
function discLevels(animal){
  const a=ANIMALS[animal]; if(!a) return null;
  const [hi,lo]=a.p.split('/');
  const rest=DISC_LETTERS.filter(l=>l!==hi&&l!==lo);
  const out={};
  out[hi]=4; out[lo]=1;
  out[rest[0]] = (a.n===2||a.n===4) ? 3 : 2;
  out[rest[1]] = (a.n===3||a.n===4) ? 3 : 2;
  return DISC_LETTERS.map(l=>({l:l,v:out[l]}));
}

   prepMentor:'Review the mentee\u2019s current website and social profiles, and flag anything over-built. Have the Purchase Range Reckoner ready, branded in their colours and logo, to hand over.',
   prepMentee:'Bring the warm database list from Week 1 and links to current social profiles. Note any credibility from a prior career that could serve as early social proof.',
   agenda:[
    ['0 – 3 min','Pipeline and deal check.'],
    ['3 – 10 min','The personal brand. Position around the person, not the company name. The structure that works: a short video, real social proof, a booking link. Identify what social proof this person can show right now, including credibility carried over from any previous career.'],
    ['10 – 18 min','Warm database activation. The refinance play for family and friends in the first ninety days. Segment the list and pick the first tier to contact. Hand over the outreach script and adapt it to their voice.'],
    ['18 – 25 min','Content rhythm. One channel done well beats five done badly, and LinkedIn is the FYI default. Set a simple, repeatable posting cadence and a habit of repurposing one idea into several posts.'],
    ['25 – 30 min','Set the tasks below and recap.']
   ],
   scriptBox:{
    h:'Warm reactivation message · template to adapt per contact',
    body:'Hi [Name], quick one. As you probably already know, I\u2019ve moved into mortgage broking, and I\u2019ve been helping people close to me take a proper look at their home loan before rates shift again. There\u2019s nothing you need to do today. It might just be worth knowing where you actually stand. And whenever you\u2019re ready to see how much you could be saving, I\u2019ll make the whole thing simple for you.',
    note:'The wording uses pacing and gentle presupposition, so the reader feels no pressure while a clear next step is planted. Teach the pattern, not the exact words, so every broker still sounds like themselves.'
   },
   mentee:['Contact the first tier of the warm database, around ten people, using the adapted script',

     'Post once on the chosen channel before the next meeting'],
   mentor:['Deliver the Purchase Range Reckoner, branded in the mentee\u2019s colours and logo',
     'Provide the outreach script template in writing',
     'Note who the mentee finds hardest to contact; that resistance is worth coaching'],
   done:'The first warm outreach batch is sent, the personal brand basics are live, one piece of content is posted, and the branded reckoner is in the mentee\u2019s hands.'},

  {id:'w3',n:'03',t:'Referral Partners & the Partner Value Pack',
   focus:'Build the first referral partner relationships and put the Partner Value Pack to work, so the pipeline stops depending on one finite list of contacts.',
   whereH:'Where this sits',
   where:'The warm database runs out. Referral partners are the engine of a pipeline that lasts and scales. The differentiator is simple: most of the field of twenty-two and a half thousand brokers ask partners for scraps, while the FYI broker shows up with a value pack that makes the partner look good to their own clients. Prior careers are a warm way in: accountants, financial advisers, buyers agents, real estate contacts, and conveyancers. Temper expectations, because this week plants these relationships and the harvest comes later.',
   prepMentor:'Have the Partner Value Pack ready to brand, and prepare the differentiation angle for this specific mentee based on their background and network.',
   prepMentee:'List potential partner types and any existing contact inside each one. Prior colleagues and industry relationships count, and often convert fastest.',
   agenda:[
    ['0 – 3 min','Pipeline and deal check.'],
    ['3 – 9 min','Who are the right partners. Quality over quantity. Map existing warm contacts first, since a lukewarm introduction beats a cold approach every time.'],
    ['9 – 16 min','The value-first approach. What you give before you ask. How the Partner Value Pack works: the partner shares a link, the client fills in a few details, and it comes straight back to the broker. Position the broker as the professional who makes the partner look good.'],
    ['16 – 24 min','The approach conversation. How to open a partner relationship without sounding needy. Pick two or three partners to approach this week and rehearse the opening line.'],
    ['24 – 30 min','Set the tasks below and recap.']
   ],
   mentee:['Approach two or three target partners with the value-first pitch and the Partner Value Pack link',
     'Reconnect with prior-career contacts as potential partners',
     'Log every partner conversation in the pipeline notes'],
   mentor:['Brand and send the Partner Value Pack',
     'Provide the partner approach script',
     'Flag any partner type that suits this mentee\u2019s background especially well'],
   done:'Two or three partner conversations are open, the Partner Value Pack is live and branded, and a target partner list is documented for the weeks ahead.'},

  {id:'w4',n:'04',t:'Systems, Rhythm & 30-Day Review',
   focus:'Embed the operating rhythm, review the first deals through the swim lanes, and check goals against actuals before the mentee moves toward independence.',
   whereH:'Where this sits',
   where:'By Week 4 there should be live activity. Now you install the discipline that keeps deals moving, read what the analytics are starting to show, and shore up the weak swim lane, which for a natural hunter is usually the admin-heavy middle lane. This becomes the operating system for the rest of the program and beyond.',
   prepMentor:'Pull the mentee\u2019s Kanban and analytics and note the early patterns. Decide in advance which swim lane you expect to be the weak point, then test it against the data.',
   prepMentee:'Have every live deal staged correctly in the 20-stage Kanban, so the review is quick and honest.',
   agenda:[
    ['0 – 3 min','Pipeline and deal check.'],
    ['3 – 10 min','Kanban discipline. The 20 stages; green is the team, blue is the broker. Install the weekly pipeline review habit: every deal, every stage, every week, in the spirit of the old Tuesday NINJA meeting.'],
    ['10 – 18 min','The 30-day review. Goals against actuals in the analytics. Which swim lane is lagging, and why. Keep it factual, not emotional.'],
    ['18 – 25 min','Shore up the weak lane. Put a system or process around the stage where deals stall, so the time to getting paid shortens.'],
    ['25 – 30 min','Set the cadence for weeks 5 to 8, remind the mentee about the monthly feedback form, and recap.']
   ],
   mentee:['Run one self-led pipeline review before the next meeting',

     'Complete the monthly feedback form if it is due'],

     'Confirm the next eight-week booking block with Darrel',
     'Decide whether the elite CRM bolt-on is worth raising yet'],
   done:'All deals are staged, the first 30-day review is complete, the weak swim lane has a fix in place, and weeks 5 to 8 are booked.'}

{id:'s19',g:'Mortgage Broker Foundation Program',n:'Coach Leave and Absence',
 purpose:'To ensure that when a coach takes leave, every mentee is told before it happens, sessions are '+
   'covered or rescheduled, and the response times promised in the Participation Agreement are honoured '+
   'rather than quietly stretched.',
 scope:'All FYI coaches taking planned leave. Applies to Ben and to any contractor coach, including Helen. '+
   'Unplanned absence follows the same steps compressed into whatever notice exists.',
 inputs:['The coach\u2019s leave dates, first and last day away',
   'The Coach Leave panel on Future Events in The Bridge',
   'The mentee list for that coach, from the Clients tab',
   'Response times as written in the Participation Agreement',
   'Access to the coach\u2019s calendar and Delenta availability'],
 steps:[
  {t:'Record it the day you are told',b:[
    'Future Events, Coach Leave, Add coach leave',
    'Enter coach, first day away, last day away',
    'Do this however far out it is. The countdown and the reminders work off this record and nothing else',
    'A coach giving three months\u2019 notice is the easiest case to get wrong, because there is no urgency to act']},
  {t:'30 days out, agree the cover',b:[
    'Decide who picks up sessions, or whether they are deferred',
    'Enter that person in Covered by, because it goes into every mentee email',
    'If nothing is being covered, say so explicitly rather than leaving it blank',
    'Check the leave against the Wednesday Group Chat calendar and the season rule',
    'Check whether any mentee is inside their First 30 Days, since those weeks are hardest to move']},
  {t:'14 days out, tell the mentees',b:[
    'Open the leave record. Every mentee coached by that person is listed with an email ready',
    'Copy each one, check it reads right for that person, send it',
    'The email carries the dates, who is covering, the normal response time, the response time while away, and what to do if it is urgent',
    'Do not send one message to everyone. Each mentee gets their own, addressed to them']},
  {t:'14 days out, move the sessions',b:[
    'Reschedule anything booked inside the window',
    'Close the coach\u2019s Delenta availability for those dates so nothing new lands in them',
    'Update the calendar so the leave is visible to Darrel']},
  {t:'7 days out, send the reminder',b:[
    'Second, shorter email from the same panel',
    'Confirms the dates and repeats the response times',
    'This is the one that gets read. The first one is filed and forgotten']},
  {t:'2 days out, hand over',b:[
    'Anything live goes to whoever is covering: deals mid-flight, mentees on a PIP, anyone flagged Red',
    'Post-meeting summaries up to date so the cover has context',
    'Out of office on the coach\u2019s email, naming who to contact']},
  {t:'On return',b:[
    'Coach reviews what came in while away before the first session back',
    'Anything the cover handled is written into the client file, not left in someone\u2019s head',
    'First session back opens with what has banked up']}
 ],
 check:['Leave recorded in The Bridge the day it was notified','Cover agreed and named',
   'Wednesday Group Chat checked against the dates','First 30 Days mentees identified',
   '14 day email sent to every affected mentee','Sessions inside the window rescheduled',
   'Delenta availability closed for the dates','7 day reminder sent',
   'Handover completed for anything live','Out of office set',
   'Client files updated on return'],
 notes:['The commitment that matters is the response time. A mentee who knows their coach is away and '+
   'knows it will be two days rather than one is fine. A mentee who hears nothing and waits is not.',
  'For contractor coaches, leave does not change the RCTI. Their mentees are still on the book and '+
   'still paying, so the coverage has to be real.',
  'If leave is unplanned, run the same steps in whatever order the notice allows. The 14 and 7 day '+

/* Netlify Identity puts the invite/confirmation token in the URL fragment
   when someone clicks the link in their invite email, not anywhere the
   old manual-paste flow could see without being told. This reads it
   straight off the address bar, drops it into the accept screen, and
   scrubs it from the visible URL and history so it doesn't linger there
   after the password is set. */
(function initFromInviteLink(){
  const hash = location.hash || '';
  const m = hash.match(/invite_token=([^&]+)/) || hash.match(/confirmation_token=([^&]+)/);
  if(m){
    showAccept();
    document.getElementById('acToken').value = decodeURIComponent(m[1]);
    history.replaceState(null, '', location.pathname);
  }
})();

boot();
